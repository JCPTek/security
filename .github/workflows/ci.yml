          SEMGREP_REQUIREMENTS_TXT
          # The list's review-by date (its OSV-Scanner baseline in dev-standards expires then): a warning after it,
          # so a repository that has not re-synced this step since sees that its pins are due, never a failure.
          sg_review="$(sed -n 's/^# Review by: \([0-9]\{4\}-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9]Z\)\..*$/\1/p' "$sg_req" | head -n 1)"
          # Compared as 14-digit numbers (YYYYMMDDHHMMSS, both UTC): no date parsing, the same on GNU and BSD date.
          sg_review_n="$(printf '%s' "$sg_review" | tr -d -- '-T:Z')"
          if [ -z "$sg_review" ]; then echo "::warning::the embedded Semgrep requirements carry no readable Review by date: re-sync this step from the current dev-standards template."
          elif [ "$(date -u +%Y%m%d%H%M%S)" -ge "$sg_review_n" ]; then echo "::warning::the embedded Semgrep requirements are past their review-by date ($sg_review): their OSV-Scanner baseline in dev-standards has expired, so these pins may carry advisories nobody has reviewed. Re-sync this step from the current dev-standards template."; fi
          if ! awk -v want="semgrep==$sg_ver" '{ sub(/\r$/, "") } $1 == want { found = 1 } END { exit !found }' "$sg_req"; then echo "::error::the embedded Semgrep requirements do not pin semgrep==$sg_ver (SEMGREP_VERSION): regenerate them in dev-standards with the version bump (scripts/semgrep-requirements.py, then --rewrite-blocks) and re-sync this step. Failing closed (C5)."; exit 1; fi
          if ! sg_venv="$(mktemp -d "$RUNNER_TEMP/semgrep-venv.XXXXXXXX")"; then echo "::error::could not create a new directory for the Semgrep virtual environment - the SAST gate could not run, failing closed (C5)."; exit 1; fi
          if ! python3 -I -m venv "$sg_venv"; then echo "::error::could not create the Semgrep virtual environment (the runner needs python3-venv) - the SAST gate could not run, failing closed (C5)."; exit 1; fi
          if ! PIP_CONFIG_FILE=/dev/null "$sg_venv/bin/python" -I -m pip install --isolated --quiet --disable-pip-version-check --no-input --require-hashes --only-binary :all: -r "$sg_req" > "$RUNNER_TEMP/semgrep-pip.log" 2>&1; then
            tail -n 20 "$RUNNER_TEMP/semgrep-pip.log"
            echo "::error::Semgrep install failed: pip refused or could not fetch a package of the embedded Semgrep requirements (a hash mismatch is a signal, not a blip) - the SAST gate could not run, failing closed (C5)."
            exit 1
          fi
          sg_bin="$sg_venv/bin/semgrep"
          if [ ! -x "$sg_bin" ]; then echo "::error::the hash-pinned install wrote no $sg_bin - the SAST gate could not run, failing closed (C5)."; exit 1; fi
          # The venv's bin FIRST on PATH for the rest of this step: semgrep's entry point APPENDS its own scripts
          # directory to PATH and its engine starts `pysemgrep` BY NAME, so any pysemgrep earlier on PATH (a runner
          # image's own, unverified) would run the scan instead. It must resolve inside the venv, or the gate fails.
          export PATH="$sg_venv/bin:$PATH"
          if [ "$(command -v pysemgrep)" != "$sg_venv/bin/pysemgrep" ]; then echo "::error::pysemgrep resolves to '$(command -v pysemgrep)', not the hash-pinned install's $sg_venv/bin/pysemgrep - refusing to scan with an unverified Semgrep, failing closed (C5)."; exit 1; fi
          # No PYTHON* variable reaches the scan (see ISOLATED above): a PYTHONPATH sitecustomize.py, for one, would
          # run inside semgrep and pysemgrep, which cannot take -I.
          while IFS= read -r sg_pyvar; do unset "$sg_pyvar"; done < <(compgen -e | grep '^PYTHON')
          # Both outputs go to RUNNER_TEMP, OUTSIDE the scanned checkout, so neither this scan nor a later one
          # reads a report as source. The coverage step and the artifact read the same two paths.
          sg_json="$RUNNER_TEMP/semgrep-results.json"
          sg_sarif="$RUNNER_TEMP/semgrep-results.sarif"
          cfgargs=""
          # Repo-local custom rules: the security-coding rollout drops canonical rules into .semgrep/. Included
          # AS WELL AS the registry rulesets, guarded so an absent/empty .semgrep/ never fails the gate.
          if [ -d .semgrep ] && [ -n "$(find .semgrep -type f 2>/dev/null | head -n1)" ]; then cfgargs="--config .semgrep/"; fi
          # `set -f` while the config list is split: SEMGREP_CONFIG is deliberately unquoted so a
          # space-separated list becomes separate --config args, and without noglob a ruleset name
          # containing a glob character would be expanded against the working directory instead.
          set -f
          for c in ${SEMGREP_CONFIG:-p/default}; do cfgargs="$cfgargs --config $c"; done
          set +f
          # SEMGREP_TIMEOUT / SEMGREP_TIMEOUT_THRESHOLD are config (H1) that lands in argv. Validate each
          # so a fat-fingered or poisoned value fails the gate CLOSED.
          # SEMGREP_TIMEOUT must be a POSITIVE integer: Semgrep reads 0 as "no time limit at all", so a
          # single pathological file would run until the job's own timeout killed it - a red build whose
          # cause is unreadable, in place of the bounded per-rule budget this knob exists to
          # set. Raise it; never zero it. A leading zero is rejected with it (an octal-looking budget is
          # a typo, not a decision).
          timeout="${SEMGREP_TIMEOUT:-300}"
          case "$timeout" in ''|*[!0-9]*|0*) echo "::error::SEMGREP_TIMEOUT='$timeout' is not a positive integer (0 means NO limit in Semgrep, which hangs the job instead of bounding a rule) - refusing to run (H1 config, C5 fail closed)."; exit 1 ;; esac
          tthresh="${SEMGREP_TIMEOUT_THRESHOLD:-0}"
          case "$tthresh" in ''|*[!0-9]*) echo "::error::SEMGREP_TIMEOUT_THRESHOLD='$tthresh' is not an integer - refusing to run (H1 config, C5 fail closed)."; exit 1 ;; esac
          # Pre-delete both outputs, as the other scanner steps do: a report left by an earlier run in a
          # reused workspace would otherwise be graded as this run's, and a scan that died before writing
          # would be read as the previous scan's clean result.
          rm -f "$sg_json" "$sg_sarif"
          # ONE SCAN, BOTH SEVERITIES. `--severity` FILTERS rather than setting a floor, so asking for
          # ERROR alone leaves every WARNING rule the registry ships absent from the report entirely,
          # not merely non-blocking. Repeating the flag asks for both in a single pass, which is also
          # half the runtime of scanning twice. INFO is deliberately NOT requested: it is registry noise
          # nobody is going to read, and an annotation nobody reads is worse than no annotation.
          # ONE run writes BOTH outputs: the SARIF is the uploaded artifact, and the JSON is both the
          # gate of record below AND what the coverage check reads - Semgrep records a timed-out or
          # errored rule in errors[], never as a SARIF result, so the artifact alone cannot prove the
          # scan was complete.
          # `set -f` again here, not just around the SEMGREP_CONFIG split above: $cfgargs is expanded
          # unquoted below so the --config values split into separate args, and without noglob a
          # ruleset name containing a glob character would be expanded against the working directory
          # at THIS use site too.
          set -f
          # shellcheck disable=SC2086 # $cfgargs is split on purpose into separate --config args, under set -f
          "$sg_bin" scan $cfgargs --severity ERROR --severity WARNING --error --quiet \
            --timeout "$timeout" --timeout-threshold "$tthresh" \
            --sarif-output "$sg_sarif" --json-output "$sg_json" .
          rc=$?
          set +f
          # THE EXIT CODE IS NO LONGER THE GATE, because it cannot be: with both severities in one run,
          # `--error` returns 1 for a WARNING-only scan exactly as it does for an ERROR, and WARNING must
          # not block. 0 and 1 both mean "Semgrep ran"; anything else is an internal error and still
          # fails closed (C5). The severity split is decided from the JSON below.
          if [ "$rc" != "0" ] && [ "$rc" != "1" ]; then
            echo "::error::Semgrep could not run (exit $rc) - an internal error, not a clean scan. Failing closed (C5)."
            exit 1
          fi
          if [ ! -f "$sg_json" ]; then
            echo "::error::Semgrep exited $rc but wrote no semgrep-results.json - the gate cannot read what it found, failing closed (C5)."
            exit 1
          fi
          SG_JSON="$sg_json" node -e '
            const fs = require("fs");
            let d;
            try { d = JSON.parse(fs.readFileSync(process.env.SG_JSON, "utf8")); }
            catch (e) { console.log("::error::semgrep-results.json is unreadable (" + e.message + ") - the SAST gate cannot grade the scan, failing closed (C5)."); process.exit(1); }
            const oneLine = (s) => String(s == null ? "" : s).replace(/\s+/g, " ").trim();
            const sev = (r) => oneLine(r.extra && r.extra.severity).toUpperCase();
            const at = (r) => r.path + ":" + ((r.start && r.start.line) || 0);
            const results = d.results || [];
            const errors = results.filter((r) => sev(r) === "ERROR");
            const warnings = results.filter((r) => sev(r) === "WARNING");
            // WARNING first, so the blocking list is the last thing in the log.
            for (const r of warnings) console.log("::warning::" + at(r) + " " + r.check_id + " " + oneLine(r.extra && r.extra.message));
            for (const r of errors) console.log("::error::" + at(r) + " " + r.check_id + " " + oneLine(r.extra && r.extra.message));
            // A result at neither severity can only come from a future Semgrep that ignores --severity.
            // Report it rather than silently dropping it; it does not block.
            const other = results.length - errors.length - warnings.length;
            if (other > 0) console.log("::warning::" + other + " Semgrep result(s) at a severity this gate did not request - reported, not blocking.");
            if (errors.length) {
              console.log("::error::Semgrep found " + errors.length + " ERROR-severity code finding(s) (C5 SAST). Fix them, or record a decision note. The " + warnings.length + " WARNING finding(s) above do not block.");
              process.exit(1);
            }
            console.log("Semgrep: 0 ERROR-severity findings, " + warnings.length + " WARNING-severity finding(s) reported and not blocking.");
          '
          sg_rc=$?
          sg_done=1
          exit "$sg_rc"

      # ---------- SAST coverage: what Semgrep could NOT analyse (a clean exit 0 is not proof of coverage) ----------
      - name: Semgrep coverage check (C5, fail closed on a dropped rule)
        if: ${{ !cancelled() }}
        run: |
          # Semgrep exits 0 when a rule times out on a file and when a file is skipped: the rule simply
          # produces no finding for it. The exit code cannot express "I did not look", so this step reads
          # the machine-readable report instead and fails closed on any evidence of incomplete analysis.
          # ONE report covers BOTH severities now (the gate above runs a single ERROR+WARNING scan), so
          # this is the whole coverage picture - there is no second scan whose coverage goes unchecked.
          set -e
          # The scan step wrote both reports under RUNNER_TEMP, outside the checkout.
          sg_json="$RUNNER_TEMP/semgrep-results.json"
          sg_sarif="$RUNNER_TEMP/semgrep-results.sarif"
          if [ ! -f "$sg_json" ]; then
            echo "::error::semgrep-results.json missing - the SAST gate cannot prove what it scanned, failing closed (C5)."
            exit 1
          fi
          SG_JSON="$sg_json" SG_SARIF="$sg_sarif" node -e '
            const fs = require("fs");
            let d;
            try { d = JSON.parse(fs.readFileSync(process.env.SG_JSON, "utf8")); }
            catch (e) { console.log("::error::semgrep-results.json is unreadable (" + e.message + ") - the SAST gate cannot prove what it scanned, failing closed (C5)."); process.exit(1); }
            const oneLine = (s) => String(s == null ? "" : s).replace(/\s+/g, " ").trim();
            // errors[] is NOT one severity. Semgrep reports a file it could not fully parse at
            // level "warn" and STILL scans the parts it understood; it reports a dropped rule
            // (timeout, OOM, a missing plugin) as a COVERAGE LOSS. Failing on every entry made a
            // partially-parsed vendored .js fail the build with the same message a genuinely
            // unscanned file gets, and the fix people reach for is deleting the check. So: the
            // coverage-loss types below, and anything at level "error", fail closed; a warn-level
            // parse complaint is annotated and kept in the artifact for a human.
            const COVERAGE_LOSS = ["Timeout", "TimeoutDuringInterfile", "OutOfMemory",
                                   "OutOfMemoryDuringInterfile", "MaxMemory", "MissingPlugin"];
            let fail = 0, warned = 0;
            for (const e of (d.errors || [])) {
              let type = e.type;
              if (Array.isArray(type)) type = type[0];   // PartialParsing arrives as ["PartialParsing", [spans]]
              type = oneLine(type);
              const level = oneLine(e.level).toLowerCase();
              const path = e.path || "<unknown>";
              // An unrecognised level is treated as an error: a report we cannot grade is not a
              // report that says everything was fine.
              const isLoss = COVERAGE_LOSS.indexOf(type) !== -1 || level === "error" ||
                             (level !== "warn" && level !== "warning");
              if (isLoss) {
                console.log("::error::Semgrep error (" + type + ", level " + (level || "<none>") + ") on " + path +
                            ": " + oneLine(e.message) +
                            " - rules did not run over this file, which is not a clean scan (C5).");
                fail++;
              } else {
                // Typically PartialParsing / SyntaxError: Semgrep read what it could and exited 0.
                // Reported, not blocking - it is in semgrep-results.json in the artifact either way.
                console.log("::warning::Semgrep " + type + " (level " + level + ") on " + path + ": " + oneLine(e.message) +
                            " - the file was analysed only as far as it parsed. Fix the file or exclude it deliberately (C5).");
                warned++;
              }
            }
            // paths.skipped is only populated on a verbose run, so its absence proves nothing and must
            // never be read as "nothing was skipped". When it IS there, a timeout reason is a dropped rule.
            for (const s of ((d.paths && d.paths.skipped) || [])) {
              const reason = oneLine(s.reason);
              if (/timeout|timed.?out/i.test(reason)) {
                console.log("::error::Semgrep skipped " + (s.path || "<unknown>") + " (" + reason + ") - raise SEMGREP_TIMEOUT rather than accepting the gap (C5).");
                fail++;
              }
            }
            // The SARIF the artifact carries reports tool trouble in its own place. Read it too, so the
            // gate holds if a future edit keeps SARIF and drops the JSON side-output.
            try {
              const s = JSON.parse(fs.readFileSync(process.env.SG_SARIF, "utf8"));
              for (const run of (s.runs || [])) {
                for (const inv of (run.invocations || [])) {
                  for (const n of (inv.toolExecutionNotifications || [])) {
                    if (n.level === "error") {
                      console.log("::error::Semgrep SARIF toolExecutionNotification (error): " + oneLine(n.message && n.message.text) + " (C5).");
                      fail++;
                    }
                  }
                }
              }
            } catch (e) { /* no SARIF, or unreadable: the JSON above is the gate of record */ }
            if (fail) { console.log("::error::" + fail + " Semgrep coverage failure(s): the scan is incomplete, so exit 0 would have been a green check produced by not looking (C5)."); process.exit(1); }
            const scanned = ((d.paths && d.paths.scanned) || []).length;
            console.log("Semgrep coverage: " + scanned + " files scanned, no dropped rules, no timeout-skipped files" +
                        (warned ? " (" + warned + " non-blocking parse warning(s) above)" : "") + ".");
          '
      - name: Semgrep results (SARIF artifact)
        if: ${{ !cancelled() }}
        # SHA-pinned (C4).
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: semgrep-results
          # BOTH outputs of the ONE scan: the SARIF for viewers, the JSON because it is the only one
          # carrying errors[] and paths.skipped[] - i.e. the evidence of what the scan could NOT
          # analyse - and because it is what the gate itself graded. There is no second report: ERROR
          # and WARNING findings are both in here.
          # Both live under RUNNER_TEMP (written there by the scan step), never in the checkout.
          path: |
            ${{ runner.temp }}/semgrep-results.sarif
            ${{ runner.temp }}/semgrep-results.json
          if-no-files-found: ignore

      # ---------- PowerShell: PSScriptAnalyzer security rules (OSV and Semgrep cover neither .ps1) ----------
      - name: PSScriptAnalyzer security gate (C5 PowerShell carve-out — see profiles/windows-ad.md)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Self-skip GREEN when the repo has no PowerShell — a real "no PS here" pass, not a blanked gate.
          $ps1 = Get-ChildItem -Path . -Recurse -Include *.ps1,*.psm1,*.psd1 -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\\/](\.git|node_modules|bin|obj|dist|build|packages|Old)[\\/]' }
          if (-not $ps1) { Write-Host 'PSScriptAnalyzer: no PowerShell files in this repo - nothing to scan.'; exit 0 }
          $ver = if ($env:PSSA_VERSION) { $env:PSSA_VERSION } else { '1.24.0' }
          Install-Module PSScriptAnalyzer -RequiredVersion $ver -Scope CurrentUser -Force -SkipPublisherCheck
          # Curated SECURITY rules only (config-driven). Any finding from these fails the build; this is
          # PowerShell's only automated coverage, so it is a real gate, not a dashboard. DC-bound .ps1
          # headed for NETLOGON/SYSVOL additionally pass local validate_ps_clm (CLM/StrictMode) - that
          # lane is operator-run, not a hosted-runner step.
          $rules = if ($env:PSSA_SECURITY_RULES) { $env:PSSA_SECURITY_RULES -split '[,\s]+' | Where-Object { $_ } } else {
            @('PSAvoidUsingPlainTextForPassword','PSAvoidUsingConvertToSecureStringWithPlainText',
              'PSUsePSCredentialType','PSAvoidUsingUsernameAndPasswordParams','PSAvoidUsingInvokeExpression',
              'PSAvoidUsingComputerNameHardcoded','PSAvoidUsingBrokenHashAlgorithms') }
          # -Settings as an explicit hashtable, never -IncludeRule alone: with no -Settings, Invoke-ScriptAnalyzer
          # LOADS a PSScriptAnalyzerSettings.psd1 it finds in the scanned path. Its CustomRulePath modules are then
          # imported (repository code running inside this gate) and its ExcludeRules and Severity merge in, so a
          # pull request could switch the gate off. An explicit -Settings value turns that discovery off.
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings @{ IncludeRules = @($rules) } -ErrorAction Continue)
          if ($findings.Count) {
            $findings | ForEach-Object { Write-Host ("{0}:{1} {2} - {3}" -f $_.ScriptName, $_.Line, $_.RuleName, $_.Message) }
            Write-Host "::error::PSScriptAnalyzer found $($findings.Count) PowerShell security finding(s) (C5). Fix them, or record a decision note."
            exit 1
          }
          Write-Host "PSScriptAnalyzer: $($ps1.Count) PowerShell file(s) scanned, no security-rule findings."

      # ---------- IaC / misconfig: Trivy (Dockerfiles + IaC; C5 defense-in-depth) ----------
      # Raw checksum-verified download rather than aquasecurity/trivy-action: SHA-pinning the ACTION pins the
      # wrapper, not the scanner - the action still fetches a Trivy binary chosen at runtime, which is the exact
      # unverified-executable hole CI-audit HIGH#1 exists to close. Same reasoning as the OSV step above, and it
      # keeps this template byte-for-byte parallel with ci-selfhosted.yml. Trivy covers the Dockerfile/IaC
      # surface; zizmor (below) covers GitHub Actions workflow security.
      - name: Trivy IaC/misconfig gate (C5 — three states, fail-closed)
        if: ${{ !cancelled() }}
        run: |
          set -e
          ver="${TRIVY_VERSION:-0.73.0}"
          # Release asset AND pin by RUNNER_ARCH (see the env block); any other architecture fails closed
          # BEFORE downloading.
          case "${RUNNER_ARCH:-}" in
            X64)   asset="trivy_${ver}_Linux-64bit.tar.gz"; want="$TRIVY_SHA256" ;;
            ARM64) asset="trivy_${ver}_Linux-ARM64.tar.gz"; want="$TRIVY_SHA256_ARM64" ;;
            *)
              echo "::error::Trivy could not run: RUNNER_ARCH='${RUNNER_ARCH:-}' is neither X64 nor ARM64, so this template has no pinned Trivy asset or SHA-256 for this runner. A scan that did not run is NOT a clean scan (C3/C5) - failing closed."
              exit 1 ;;
          esac
          # Defence in depth: never compare against an empty or malformed pin (an empty want would match an empty hash).
          if ! printf '%s' "$want" | grep -Eq '^[0-9a-f]{64}$'; then echo "::error::Trivy: the pinned SHA-256 for $asset is missing or malformed in the env block - refusing to download an unverifiable binary. FAILING CLOSED (C4/C5)."; exit 1; fi
          curl -sSfL --connect-timeout 10 --speed-limit 1024 --speed-time 30 --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 "https://github.com/aquasecurity/trivy/releases/download/v${ver}/${asset}" -o "$RUNNER_TEMP/trivy.tgz"
          actual=$(sha256sum "$RUNNER_TEMP/trivy.tgz" | cut -d' ' -f1)
          if [ "$actual" != "$want" ]; then
            echo "::error::Trivy download checksum mismatch for $asset: expected $want got $actual. Refusing to extract an unverified binary (CI-audit HIGH#1). If TRIVY_VERSION was bumped, update TRIVY_SHA256 (X64) and TRIVY_SHA256_ARM64 (ARM64)."
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
          chmod +x "$RUNNER_TEMP/trivy"
          "$RUNNER_TEMP/trivy" --version
          # --exit-code 0: never let Trivy's own exit code decide pass/fail - a real scanner error also returns
          # non-zero and would be indistinguishable from findings. Write JSON and parse it, exactly like OSV.
          # --skip-check-update: use the misconfig checks bundled INSIDE this hash-verified trivy binary rather
          # than pulling the policy pack from an OCI registry at runtime (that runtime OCI fetch was an
          # unverified-code hole, same class as the package-manager residual risk noted in the env block).
          set +e
          # The report goes to RUNNER_TEMP, OUTSIDE the scanned checkout; the reader below and the artifact use it.
          tv_out="$RUNNER_TEMP/trivy-config.json"
          # No repository config reaches the scan, and of the ignore files only the reviewed one does (C5): --config names
          # an EMPTY file, so Trivy does not load ./trivy.yaml (refused by the Suppression inventory step: it can name
          # another ignore file, skip paths and change the severities). --ignorefile names a copy of the root .trivyignore
          # as the INDEX holds it, when the index holds a regular file at exactly that path (the inventory step lists each
          # of its ids against section 5), and an EMPTY file otherwise, so nothing left on disk adds an id. Both are under
          # RUNNER_TEMP, outside the checkout. Empty, not absent: an explicit --ignorefile that does not exist is a fatal
          # flag error (measured on Trivy 0.73.0). git runs in the inventory step's environment (no system or global
          # config, replace objects off, safe.directory = this workspace) with constant arguments and an object id it
          # printed itself.
          tv_cfg="$RUNNER_TEMP/trivy-empty-config.yaml"; tv_ign="$RUNNER_TEMP/trivy-ignorefile"; tv_idx="$RUNNER_TEMP/trivy-ignorefile-entry"
          printf '{}\n' > "$tv_cfg"; : > "$tv_ign"
          tv_git() { GIT_NO_REPLACE_OBJECTS=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="${GITHUB_WORKSPACE%/}" git --no-replace-objects "$@"; }
          if ! tv_git ls-files -z -s -- .trivyignore > "$tv_idx"; then
            echo "::error::Trivy could not run: git could not read the index entry for .trivyignore, so the step cannot tell which ignore file was reviewed. A scan that did not run is NOT a clean scan (C3/C5) - failing closed."
            exit 1
          fi
          tab=$'\t'; tv_oid=""
          while IFS= read -r -d '' tv_rec; do
            [ "${tv_rec#*"$tab"}" = ".trivyignore" ] || continue
            case "${tv_rec%%"$tab"*}" in "100644 "*" 0"|"100755 "*" 0") tv_oid="${tv_rec#* }"; tv_oid="${tv_oid%% *}" ;; esac
          done < "$tv_idx"
          case "$tv_oid" in *[!0-9a-f]*) tv_oid="" ;; esac
          if [ -n "$tv_oid" ]; then
            if ! tv_git cat-file blob "$tv_oid" > "$tv_ign"; then
              echo "::error::Trivy could not run: git could not read the root .trivyignore from the index. A scan that did not run is NOT a clean scan (C3/C5) - failing closed."
              exit 1
            fi
            echo "Trivy honours the root .trivyignore as committed (the Suppression inventory step lists each of its ids against section 5)."
          else
            echo "No root .trivyignore is tracked as a regular file, so --ignorefile names an empty file."
          fi
          "$RUNNER_TEMP/trivy" config --config "$tv_cfg" --ignorefile "$tv_ign" --severity "${TRIVY_SEVERITY:-HIGH,CRITICAL}" --skip-check-update --format json --exit-code 0 --output "$tv_out" .
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::Trivy could not run (exit $rc). A scan that did not run is NOT a clean scan (C3/C5) - failing closed."
            exit 1
          fi
          if [ ! -f "$tv_out" ]; then
            echo "::error::Trivy produced no JSON - the IaC scan could not run, failing closed (C5)."
            exit 1
          fi
          TV_REPORT="$tv_out" node - <<'EOF'
          const fs=require("fs");
          let doc;try{doc=JSON.parse(fs.readFileSync(process.env.TV_REPORT,"utf8"))}catch(e){console.log(`::error::Trivy output was not valid JSON (${e.message}) - a scan whose result cannot be read is NOT clean, failing closed (C5).`);process.exit(1)}
          const sev=(process.env.TRIVY_SEVERITY||"HIGH,CRITICAL");
          const sum=process.env.GITHUB_STEP_SUMMARY,w=s=>{if(sum){try{fs.appendFileSync(sum,s+"\n")}catch{}}};
          const findings=[];
          for(const r of (doc.Results||[]))for(const m of (r.Misconfigurations||[])){findings.push({sev:m.Severity,id:m.ID,title:m.Title,target:r.Target})}
          if(findings.length){
            findings.forEach(f=>console.log(`${String(f.sev).padEnd(8)} ${f.id} ${f.title} (${f.target})`));
            w("### :x: Trivy: IaC/config misconfigurations");w("");w(`Severity gate \`${sev}\`.`);w("");
            findings.forEach(f=>w(`- \`${f.id}\` ${f.title} — **${f.sev}** (${f.target})`));
            console.log(`::error::${findings.length} Trivy misconfiguration(s) at severity ${sev} (C5). Fix the Dockerfile/IaC, or record a decision note.`);
            process.exit(1);
          }
          console.log(`Trivy: no ${sev} misconfigurations in Dockerfiles/IaC.`);
          EOF
      - name: Trivy results (artifact)
        if: ${{ !cancelled() }}
        # SHA-pinned (C4).
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: trivy-results
          path: ${{ runner.temp }}/trivy-config.json   # written under RUNNER_TEMP by the gate step, never in the checkout
          if-no-files-found: ignore

      # ---------- GitHub Actions workflow SECURITY: zizmor (unpinned actions, template-injection, ...) ----------
      - name: zizmor workflow-security gate (C5 — three states, fail-closed)
        if: ${{ !cancelled() }}
        run: |
          if [ ! -d .github/workflows ]; then echo "zizmor: no .github/workflows - nothing to audit."; exit 0; fi
          # Release binary, not `pipx install zizmor==...`: a pip install resolves and executes code from PyPI
          # that no checksum here covers, so it cannot satisfy CI-audit HIGH#1. The static binary can be pinned
          # by content. Download failure or checksum mismatch fails the gate CLOSED - a workflow-security gate
          # that could not run is not a pass.
          set -e
          ver="${ZIZMOR_VERSION:-1.29.0}"
          # Release asset AND pin by RUNNER_ARCH (see the env block); any other architecture fails closed
          # BEFORE downloading.
          case "${RUNNER_ARCH:-}" in
            X64)   asset="zizmor-x86_64-unknown-linux-gnu.tar.gz";  want="$ZIZMOR_SHA256" ;;
            ARM64) asset="zizmor-aarch64-unknown-linux-gnu.tar.gz"; want="$ZIZMOR_SHA256_ARM64" ;;
            *)
              echo "::error::zizmor could not run: RUNNER_ARCH='${RUNNER_ARCH:-}' is neither X64 nor ARM64, so this template has no pinned zizmor asset or SHA-256 for this runner. A workflow-security audit that could not run is NOT a pass - failing closed (C5)."
              exit 1 ;;
          esac
          # Defence in depth: never compare against an empty or malformed pin (an empty want would match an empty hash).
          if ! printf '%s' "$want" | grep -Eq '^[0-9a-f]{64}$'; then echo "::error::zizmor: the pinned SHA-256 for $asset is missing or malformed in the env block - refusing to download an unverifiable binary. FAILING CLOSED (C4/C5)."; exit 1; fi
          curl -sSfL --connect-timeout 10 --speed-limit 1024 --speed-time 30 --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 "https://github.com/zizmorcore/zizmor/releases/download/v${ver}/${asset}" -o "$RUNNER_TEMP/zizmor.tgz"
          actual=$(sha256sum "$RUNNER_TEMP/zizmor.tgz" | cut -d' ' -f1)
          if [ "$actual" != "$want" ]; then
            echo "::error::zizmor download checksum mismatch for $asset: expected $want got $actual. Refusing to extract an unverified binary (CI-audit HIGH#1). If ZIZMOR_VERSION was bumped, update ZIZMOR_SHA256 (X64) and ZIZMOR_SHA256_ARM64 (ARM64) (zizmor publishes no checksum file - recompute from the release asset)."
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/zizmor.tgz" -C "$RUNNER_TEMP" zizmor
          chmod +x "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor" --version
          set +e
          lvl="${ZIZMOR_MIN_SEVERITY:-medium}"
          # zizmor writes SARIF to STDOUT (no --output flag). --no-online-audits keeps it deterministic and
          # token-free (offline audits cover unpinned-uses + template-injection). The SARIF goes to RUNNER_TEMP,
          # outside the checkout; the reader below and the artifact use the same path.
          zz_out="$RUNNER_TEMP/zizmor-results.sarif"
          # --no-config: zizmor 1.29.0 otherwise loads .github/zizmor.yml or zizmor.yml (either extension) from the repository
          # root, and that file can turn audits off and ignore findings by file and line (the Suppression inventory step
          # refuses it, C5). Verified: a committed .github/zizmor.yml disabling unpinned-uses hides that finding, and
          # --no-config brings it back.
          "$RUNNER_TEMP/zizmor" --no-config --no-online-audits --min-severity "$lvl" --format sarif .github/workflows > "$zz_out" 2>/dev/null
          rc=$?
          # CI-audit HIGH#3: fail on the EXIT CODE first, BEFORE parsing the SARIF. zizmor's contract in
          # --format sarif mode (verified against 1.29.0): 0 = successful audit (any findings are IN the SARIF -
          # the 11-14 finding codes are suppressed under SARIF output); 1 = audit error; 2 = bad args; 3 = no
          # inputs. So ANY nonzero here means the AUDIT ITSELF FAILED, not "found issues" - a valid-but-empty
          # SARIF emitted alongside an audit error would otherwise read clean. Fail closed (C5).
          if [ $rc -ne 0 ]; then
            echo "::error::zizmor exited $rc - an audit error / bad args / no inputs, NOT findings (SARIF mode does not use finding exit codes). A workflow-security audit that could not run is NOT a pass - failing closed (C5)."
            exit 1
          fi
          # Findings themselves are read from the SARIF at --min-severity below; it must exist and be non-empty.
          if [ ! -s "$zz_out" ]; then
            echo "::error::zizmor produced no SARIF - the workflow-security audit could not run, failing closed (C5)."
            exit 1
          fi
          ZZ_REPORT="$zz_out" node - <<'EOF'
          const fs=require("fs");
          let doc;try{doc=JSON.parse(fs.readFileSync(process.env.ZZ_REPORT,"utf8"))}catch(e){console.log(`::error::zizmor SARIF was not valid JSON (${e.message}) - failing closed (C5).`);process.exit(1)}
          const lvl=process.env.ZIZMOR_MIN_SEVERITY||"medium";
          const results=[];for(const run of (doc.runs||[]))for(const r of (run.results||[]))results.push(r);
          if(results.length){
            results.forEach(r=>{const loc=(r.locations&&r.locations[0]&&r.locations[0].physicalLocation&&r.locations[0].physicalLocation.artifactLocation&&r.locations[0].physicalLocation.artifactLocation.uri)||"";console.log(`${r.ruleId} ${loc}`)});
            console.log(`::error::${results.length} zizmor workflow-security finding(s) at/above '${lvl}' (C5). SHA-pin third-party actions (C4), remove template injection, tighten permissions - or raise ZIZMOR_MIN_SEVERITY with justification.`);
            process.exit(1);
          }
          console.log(`zizmor: no workflow-security findings at/above '${lvl}'.`);
          EOF
      - name: zizmor results (SARIF artifact)
        if: ${{ !cancelled() }}
        # SHA-pinned (C4).
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: zizmor-results
          path: ${{ runner.temp }}/zizmor-results.sarif   # written under RUNNER_TEMP by the gate step, never in the checkout
          if-no-files-found: ignore

      # ---------- Workflow correctness: actionlint (best-effort lint, NOT a security gate) ----------
      - name: actionlint download + checksum verify (gating — CI-audit MED)
        id: actionlint_verify
        # SPLIT from the lint step below: this step has NO continue-on-error, so the download / checksum-verify
        # exit 1 is a REAL gate. The old single continue-on-error step SWALLOWED a checksum mismatch (the verify's
        # exit 1 was neutered by continue-on-error). The lint INVOCATION stays best-effort in the next step.
        if: ${{ !cancelled() }}
        run: |
          set -e
          if [ ! -d .github/workflows ]; then echo "actionlint: no .github/workflows - nothing to fetch."; exit 0; fi
          ver="${ACTIONLINT_VERSION:-1.7.12}"
          # Release asset AND pin by RUNNER_ARCH (see the env block); any other architecture fails closed
          # BEFORE downloading, so no binary reaches the lint step below.
          case "${RUNNER_ARCH:-}" in
            X64)   asset="actionlint_${ver}_linux_amd64.tar.gz"; want="$ACTIONLINT_SHA256" ;;
            ARM64) asset="actionlint_${ver}_linux_arm64.tar.gz"; want="$ACTIONLINT_SHA256_ARM64" ;;
            *)
              echo "::error::actionlint: RUNNER_ARCH='${RUNNER_ARCH:-}' is neither X64 nor ARM64, so this template has no pinned actionlint asset or SHA-256 for this runner - failing closed (CI-audit HIGH#1)."
              exit 1 ;;
          esac
          # Defence in depth: never compare against an empty or malformed pin (an empty want would match an empty hash).
          if ! printf '%s' "$want" | grep -Eq '^[0-9a-f]{64}$'; then echo "::error::actionlint: the pinned SHA-256 for $asset is missing or malformed in the env block - refusing to download an unverifiable binary. FAILING CLOSED (C4/C5)."; exit 1; fi
          curl -sSfL --connect-timeout 10 --speed-limit 1024 --speed-time 30 --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 "https://github.com/rhysd/actionlint/releases/download/v${ver}/${asset}" -o "$RUNNER_TEMP/actionlint.tgz"
          # Even a best-effort tool is checksum-verified before it runs (CI-audit HIGH#1 applies to EVERY binary).
          actual=$(sha256sum "$RUNNER_TEMP/actionlint.tgz" | cut -d' ' -f1)
          if [ "$actual" != "$want" ]; then
            # CI-audit HIGH#2: a mismatch must leave NO runnable actionlint behind. Removing a stale/partial binary
            # that FAILS (locked / ACL) is itself fatal - never fall through with a bad binary on disk.
            if ! rm -f "$RUNNER_TEMP/actionlint"; then
              echo "::error::actionlint checksum mismatch AND the stale binary could not be removed - failing closed (CI-audit HIGH#2)."
              exit 1
            fi
            echo "::error::actionlint download checksum mismatch for $asset: expected $want got $actual (CI-audit HIGH#1). If ACTIONLINT_VERSION was bumped, update ACTIONLINT_SHA256 (X64) and ACTIONLINT_SHA256_ARM64 (ARM64)."
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          chmod +x "$RUNNER_TEMP/actionlint"
          echo "actionlint: downloaded and checksum-verified."

      - name: actionlint workflow lint (best-effort)
        # Non-blocking lint ONLY, and it runs ONLY when the verify step above SUCCEEDED (CI-audit HIGH#2): gating on
        # steps.actionlint_verify.outcome - not merely !cancelled() - means a checksum-failed binary never reaches
        # this exec. The supply-chain gate is the step above; zizmor is the workflow-SECURITY gate.
        if: ${{ !cancelled() && steps.actionlint_verify.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          if [ ! -d .github/workflows ]; then echo "actionlint: no .github/workflows - nothing to lint."; exit 0; fi
          "$RUNNER_TEMP/actionlint" -color
          echo "actionlint exit=$? (informational; this step is continue-on-error - zizmor is the security gate)."

      # ---------- ATT&CK enrichment (best-effort; self-skips green when the local-ai CLI is absent) ----------
      - name: finding_to_attack ATT&CK enrichment (best-effort)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          # Correlates the OSV + Semgrep findings above to MITRE ATT&CK via the local-ai CLI
          # (finding_to_attack). That CLI is not present on a GitHub-hosted runner (nor on a
          # NETWORK SERVICE self-hosted runner), so this step self-skips GREEN and prints the manual
          # invocation; the OSV/Semgrep artifacts uploaded above are its input. LOCALAI_CLI is an
          # instance value, hence config not a literal (H1).
          # Inputs AND outputs live under RUNNER_TEMP, outside the checkout (the gate steps write them there).
          cli="${LOCALAI_CLI:-}"
          if [ -z "$cli" ] || [ ! -f "$cli" ]; then
            echo "local-ai CLI not present on this runner - skipping ATT&CK enrichment (expected on a hosted/service-account runner)."
            for f in "$RUNNER_TEMP/osv-results.json" "$RUNNER_TEMP/semgrep-results.sarif"; do
              [ -f "$f" ] && echo "  manual: py <local-ai>/local_ai_cli.py finding_to_attack $(basename "$f")   (from this run's artifact)"
            done
            exit 0
          fi
          for f in "$RUNNER_TEMP/osv-results.json" "$RUNNER_TEMP/semgrep-results.sarif"; do
            if [ -f "$f" ]; then py "$cli" finding_to_attack "$f" > "$RUNNER_TEMP/attack-$(basename "$f" | cut -d. -f1).json" || true; fi
          done
      - name: ATT&CK enrichment results (artifact)
        if: ${{ always() }}
        # SHA-pinned (C4).
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: attack-enrichment
          path: ${{ runner.temp }}/attack-*.json   # written under RUNNER_TEMP by the enrichment step, never in the checkout
          if-no-files-found: ignore

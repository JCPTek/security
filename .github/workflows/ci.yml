            // serves /<name>/-/<basename>-<version>.tgz; GitHub Packages serves /download/<name>/<version>/<sha1 of the tarball>.
            const gp=`/download/${name}/${e.version}/`,ok=host===GHP?p.startsWith(gp)&&/^[0-9a-f]{40}$/.test(p.slice(gp.length)):p===`/${name}/-/${base}-${e.version}.tgz`;
            if(!ok)return fail(`${at}: resolved ${show(r)} is not the tarball of ${name}@${e.version} (expected ${host===GHP?`/download/${name}/${e.version}/<sha1>`:`/${name}/-/${base}-${e.version}.tgz`} on ${host})`);
            tally.registry++}

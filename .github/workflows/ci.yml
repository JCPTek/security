          if [ "$rc" -ne 0 ]; then
            if [ "$findings" -lt 0 ]; then report_state="no readable findings report"; else report_state="a report listing $findings finding(s), so not a findings exit"; fi
            echo "::error::gitleaks COULD NOT RUN (rc=$rc, $report_state). This is NOT a finding and NOT a clean scan - nothing in this run graded the history. The FTL/ERR line in the gitleaks log above says why; re-run, and fix the cause if it repeats."
            exit 2
          fi
          # GIT FAILED UNDER GITLEAKS. gitleaks 8.30.1 logs every line git writes to stderr as
          # `ERR [git] ...` plus `ERR error="stderr is not empty"`, still writes a report ([]) and EXITS 0,
          # with a count covering only what git produced before it failed: 0 for a bad option, a partial
          # number for a mid-log failure (which the upper bound below accepts), or a lazy blob fetch that
          # died. None of HARD 1-3 can see that when the scope itself still counts, so ANY ERR line on a
          # clean exit fails the scan. (Its rename-limit notices are logged at WRN, not ERR.)
          err_lines=$(grep -cE '^[^ ]+ ERR ' "$RUNNER_TEMP/gitleaks-run.info.log" || true)
          if [ "$err_lines" != "0" ]; then
            echo "::error::gitleaks COULD NOT RUN cleanly: it logged $err_lines ERR line(s) above (git failed under it) yet exited 0, so the verdict covers an unknown part of $scope. Treated as a FAILED scan (exit 2)."
            exit 2
          fi
          # THE ABORT CHECK BELOW MUST BE LIVE. It reads gitleaks' debug log, so that log must show gitleaks
          # starting git. gitleaks 8.30.1 prints `<time> DBG executing: <path>/git -C . log -p -U0 <scope>
          # --remerge-diff` (measured). No such line means the log level or format changed, and the abort
          # check would pass on silence: a scan that could not be verified (exit 2).
          if [ "$live_lines" = "0" ]; then
            echo "::error::gitleaks COULD NOT RUN verifiably: its debug log has no 'DBG executing: ... log -p' line, so the git-abort check is not live and a crashed git would pass unseen. Expected from gitleaks $ver at --log-level debug; if its log format changed, fix this step - do not drop the check. The full debug log is in $RUNNER_TEMP/gitleaks-run.log. Treated as a FAILED scan (exit 2)."
            exit 2
          fi
          # GIT ABORTED UNDER GITLEAKS. A git that crashes (a signal, an access violation) often writes
          # nothing to stderr, so the ERR check above cannot see it; gitleaks' debug log can (see the
          # invocation above). Any "command aborted" or "exit status" line fails the scan.
          if [ "$abort_lines" != "0" ]; then
            echo "::error::gitleaks COULD NOT RUN cleanly: its git subprocess ABORTED ($first_abort) yet gitleaks exited $rc. gitleaks does not check git's exit status, so the scan stopped where git died and the verdict covers an unknown part of $scope (git 2.41/2.42 crash this way under --remerge-diff with GIT_ATTR_SOURCE). The full debug log is in $RUNNER_TEMP/gitleaks-run.log. Treated as a FAILED scan (exit 2)."
            exit 2
          fi
          # OCTOPUS MERGES (3+ parents). --remerge-diff cannot re-merge one: git skips it with a notice on
          # STDOUT (so no ERR line) and shows no diff, so a secret in an octopus resolution is never read.
          # Rare enough to fail closed on, naming them; a repo that needs octopus merges is handled then.
          if ! octo=$(git rev-list --count --min-parents=3 "$scope"); then
            echo "::error::COULD NOT count octopus merges in $scope (git rev-list failed). Treated as a FAILED scan (exit 2)."
            exit 2
          fi
          if [ "$octo" != "0" ]; then
            octo_list=$(git rev-list --min-parents=3 "$scope" | head -n 10 | tr '\n' ' ')
            echo "::error::$octo octopus merge(s) in $scope were NOT scanned: --remerge-diff skips merges with 3+ parents silently, so their resolutions went unread. First up to 10: $octo_list. Treated as a FAILED scan (exit 2)."
            exit 2
          fi
          # HARD 2 - PRESENCE. A clean exit with no readable count is the unattached instrument: nothing
          # in the run says how much history the verdict covers, which is the whole difference between
          # "no secrets" and "nothing was read". Missing and unparsable are both a failed scan.
          if [ "$count_lines" = "0" ]; then
            echo "::error::gitleaks exited 0 but printed no commits-scanned line, so this run's coverage cannot be audited and a clean verdict cannot be trusted. Expected one log line of the form 'N commits scanned.' from gitleaks $ver. Treated as a FAILED scan (exit 2), not a clean one; if the tool's log format changed, fix the parser in this step - do not drop the check."
            exit 2
          fi
          if [ -z "$scanned" ]; then
            echo "::error::gitleaks printed $count_lines commits-scanned line(s) this step cannot read as ONE non-negative integer: '$scanned_line'. The coverage of this run is unknown, which is treated as a FAILED scan (exit 2), not a clean one. Fix the parser in this step for gitleaks $ver - do not drop the check."
            exit 2
          fi
          # The rev-list size of the SAME scope gitleaks was given. A scope git cannot count is a scope
          # this step cannot bound, so that fails closed too.
          if ! scope_commits=$(git rev-list --count "$scope"); then
            echo "::error::gitleaks COULD NOT be bounded: 'git rev-list --count $scope' failed, so the upper bound on this scan cannot be computed. Treated as a FAILED scan (exit 2)."
            exit 2
          fi
          scope_nomerges=$(git rev-list --count --no-merges "$scope" || echo unknown)
          echo "scanned: $scanned commits (gitleaks' own count)."
          echo "scope size: $scope_commits commits (git rev-list --count $scope)."
          # HARD 1 - THE UPPER BOUND, NEVER AN EQUALITY. gitleaks counts only commits it actually diffs;
          # everything legitimate moves its number DOWN (clean merges, empty diffs, a future counting
          # change in the tool), so equality would couple the fleet to gitleaks internals and one version
          # bump could turn every repo red at once. Only a scan WIDER than its declared scope can push the
          # number UP - the scope was not applied, and the verdict covers history nobody declared.
          if [ "$scanned" -gt "$scope_commits" ]; then
            echo "::error::coverage bound VIOLATED: gitleaks reports $scanned commits scanned, but the declared scope ($scope) holds only $scope_commits. A scan can read at most the commits its scope holds, so the scan was WIDER than declared. Treated as a FAILED scan (exit 2)."
            exit 2
          fi
          # HARD 3 - THE EMPTY SCOPE (the triumphant zero). gitleaks reports "0 commits scanned." for an
          # empty range and exits 0, which reads as clean. A push always carries its own tip and a sweep
          # of a repo with history is never empty, so an empty scope on any event but a pull request
          # means the range resolved to nothing.
          if [ "$scope_commits" -eq 0 ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "::error::the declared scope ($scope) resolves to 0 commits on this $GITHUB_EVENT_NAME event, so the scan graded nothing and reported it clean. Treated as a FAILED scan (exit 2)."
            exit 2
          fi
          # ZERO SCANNED AGAINST A NON-EMPTY NON-MERGE SCOPE (the blinding signature). A push, a dispatch or a
          # schedule whose scope holds non-merge commits, of which gitleaks read NONE, is what an attribute
          # file marking everything -diff, a crash on the first commit, or a replaced history looks like:
          # every commit was there to read and nothing was. On a pull request, 0 stays the warning below
          # (a PR of merges or empty commits is legitimate).
          if [ "$scanned" -eq 0 ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            case "$scope_nomerges" in
              ''|*[!0-9]*)
                echo "::error::gitleaks scanned 0 commits in $scope on this $GITHUB_EVENT_NAME event and the non-merge count of that scope could not be read ('$scope_nomerges'), so a blinded scan cannot be ruled out. Treated as a FAILED scan (exit 2)."
                exit 2 ;;
            esac
            if [ "$scope_nomerges" -gt 0 ]; then
              echo "::error::gitleaks scanned 0 commits, but $scope holds $scope_nomerges non-merge commit(s) on this $GITHUB_EVENT_NAME event: every one was there to read and none was. That is the signature of a blinded scan (attributes marking paths -diff or binary, git dying on the first commit, replaced history). Treated as a FAILED scan (exit 2)."
              exit 2
            fi
          fi
          # PRINT-ONLY, never asserted: what the gap between git's count and gitleaks' is made of.
          echo "scope size without merges: $scope_nomerges commits (git rev-list --count --no-merges $scope); gap scope - scanned = $((scope_commits - scanned))."
          echo "Clean merges (an empty --remerge-diff) and commits with an empty diff are counted by git but give gitleaks nothing to scan; they account for the gap."
          if [ "$scanned" -eq 0 ]; then
            if [ "$scope_commits" -eq 0 ]; then
              why="the range holds no commits (everything on this branch is already in the base)"
            else
              why="every commit in it is a clean merge (empty --remerge-diff) or has an empty diff, so gitleaks had nothing to scan"
            fi
            echo "::warning::gitleaks scanned 0 commits in $scope ($scope_commits in scope, $scope_nomerges non-merge): $why. That is legitimate, but this clean result covers NO content."
          fi
          echo "gitleaks: no secrets in the scanned range ($logopts): $scanned commits scanned (gitleaks' own count)."
      - name: Gitleaks report (redacted findings artifact)
        if: ${{ !cancelled() }}
        # SHA-pinned (C4).
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json   # written under RUNNER_TEMP by the scan step, never in the checkout
          if-no-files-found: ignore

  secrets-issue:
    # TRACKING ISSUE FOR THE SWEEP (built once, here in the template; never written per repo). When the
    # full-history sweep - schedule or workflow_dispatch, scope --all - FINDS secrets, this job opens ONE
    # tracking issue in the repository, or updates the one already open, so a finding in history nobody is
    # watching reaches a person instead of ending as one more red scheduled run.
    #   * It runs only on those two events, and only when the scan step reported FOUND (its exit 1, output
    #     found=true). A COULD NOT RUN (exit 2) opens nothing: that is non-evidence, and the red run says so.
    #   * Per finding the issue carries rule id, file:line, commit and fingerprint, and NEVER the secret: the
    #     body is built from those location fields of the redacted report and nothing else (Secret and Match
    #     are never read, nor author, email or message), inside a fenced code block longer than any backtick
    #     run in it, so no committer-controlled path renders as markdown, HTML or an @mention.
    #   * ONE issue: the open issue with this fixed title that this workflow's own token created
    #     (github-actions[bot]), labelled gitleaks-sweep. A later sweep that finds something rewrites its
    #     body in place and comments ONLY when the set of fingerprints changed, so a weekly re-find of the
    #     same history notifies nobody twice. The job is serialized (concurrency below), so two sweeps
    #     cannot both create one; a third run queued behind a running one replaces the queued one, which is
    #     harmless because the newest sweep carries the newest list.
    #   * A clean sweep CLOSES NOTHING and touches nothing. A clean sweep shows only that the current
    #     ruleset and .gitleaksignore pass; a secret allowlisted or rewritten out of history is not a rotated
    #     one. Closing the issue is a person's decision.
    #   * LEAST PRIVILEGE: issues: write is granted to THIS job only. It runs no repository code (no
    #     checkout) and reads only the report artifact; the scanning job keeps contents: read.
    #   * Whether the sweep RAN at all (liveness) is not checked here; the gate owns that.
    needs: secrets
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.secrets.outputs.found == 'true' }}
    runs-on: ubuntu-latest   # a literal, never the CI_RUNS_ON expression: this repository is PUBLIC (see RUNNER SELECTION in the header)
    timeout-minutes: 10
    permissions:
      issues: write   # open or update the sweep's tracking issue and its label; nothing else
    concurrency:
      group: gitleaks-sweep-issue
      cancel-in-progress: false
    steps:
      - name: Download the redacted gitleaks report
        # SHA-pinned (C4).
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-sweep
      - name: Build the tracking-issue body (redacted location fields only)
        run: |
          node - <<'JS'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const tmp = process.env.RUNNER_TEMP;
          let report;
          try { report = JSON.parse(fs.readFileSync(path.join(tmp, "gitleaks-sweep", "gitleaks-report.json"), "utf8")); }
          catch (e) { console.log("::error::the sweep reported FOUND but its report artifact cannot be read (" + e.message.replace(/[\r\n%]/g, " ") + "), so no tracking issue can be built. Triage from the failed sweep run."); process.exit(1); }
          if (!Array.isArray(report) || report.length === 0) {
            console.log("::error::the sweep reported FOUND but its report lists no findings, so no tracking issue can be built. Triage from the failed sweep run.");
            process.exit(1);
          }
          // ONLY these five fields of each finding are read. Secret, Match, Author, Email and Message are
          // never touched, so they cannot reach the issue whatever the report holds.
          // A value is shown with CR, LF, TAB, every other C0 and C1 control character (NEL included) and
          // backslash made visible, so one finding is exactly one line and a crafted file name cannot start
          // a line of its own; the Unicode line and paragraph separators and the bidirectional controls
          // (U+202E RIGHT-TO-LEFT OVERRIDE and its kin) are shown as \uXXXX, so a name cannot break a line
          // or display in an order that hides what it is.
          const clean = (v) => String(v === undefined || v === null ? "" : v)
            .replace(/\\/g, "\\\\").replace(/\r/g, "\\r").replace(/\n/g, "\\n").replace(/\t/g, "\\t")
            .replace(/[\x00-\x1f\x7f-\x9f]/g, (c) => "\\x" + c.charCodeAt(0).toString(16).padStart(2, "0"))
            .replace(/[\u061c\u200e\u200f\u2028\u2029\u202a-\u202e\u2066-\u2069]/g, (c) => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"));
          const lines = report.map((f) => clean(f.RuleID) + "  " + clean(f.File) + ":" + clean(f.StartLine) +
            "  commit=" + clean(f.Commit) + "  fingerprint=" + clean(f.Fingerprint));
          const fps = Array.from(new Set(report.map((f) => String(f.Fingerprint)))).sort();
          const digest = crypto.createHash("sha256").update(fps.join("\n"), "utf8").digest("hex");
          let run = 0;
          for (const l of lines) for (const m of (l.match(/`+/g) || [])) run = Math.max(run, m.length);
          const fence = "`".repeat(Math.max(3, run + 1));
          const ref = String(process.env.GITHUB_REF || "").replace(/[^A-Za-z0-9._\/-]/g, "?");
          const runUrl = process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID;
          const head = [
            "<!-- gitleaks-sweep-tracking-issue: opened and updated by the secrets-issue job of CI. The next sweep that finds something rewrites this body. -->",
            "**The full-history gitleaks sweep found " + report.length + " finding(s) in this repository's history.**",
            "",
            "- Latest sweep: " + runUrl + " (event " + process.env.GITHUB_EVENT_NAME + ", ref " + ref + ", commit " + process.env.GITHUB_SHA + "), " + new Date().toISOString().replace(/\.[0-9]+Z$/, "Z") + ".",
            "- Scope: every ref in the clone (`--log-opts=--all --remerge-diff`), gitleaks " + process.env.GITLEAKS_VERSION + ".",
            "- One line per finding: rule id, file:line, commit, fingerprint. The secret values are not here and never are: the scan runs with --redact, and this list is built from those location fields only.",
            "",
            fence + "text",
          ];
          const tail = [
            fence,
            "",
            "**What to do:** rotate every real credential today, dated from the commit that introduced it. For a finding confirmed false, add its fingerprint to .gitleaksignore AFTER rotation, never instead of it. Every sweep that finds something rewrites this list; a clean sweep leaves this issue alone, so close it by hand once a sweep runs clean.",
            "",
            "<!-- gitleaks-sweep-digest: " + digest + " -->",
          ];
          // GitHub caps an issue body at 65536 characters: list what fits under 60000 and say how many more.
          const budget = 60000 - head.join("\n").length - tail.join("\n").length - 200;
          const shown = [];
          let used = 0;
          for (const l of lines) { if (used + l.length + 1 > budget) break; shown.push(l); used += l.length + 1; }
          if (shown.length < lines.length) shown.push("... and " + (lines.length - shown.length) + " more: see the gitleaks-report artifact of the sweep run above.");
          fs.writeFileSync(path.join(tmp, "gitleaks-issue-body.md"), head.concat(shown, tail).join("\n") + "\n", "utf8");
          fs.writeFileSync(path.join(tmp, "gitleaks-issue-digest.txt"), digest + "\n", "utf8");
          console.log("tracking-issue body built: " + report.length + " finding(s), " + (shown.length === lines.length ? lines.length : shown.length - 1) + " listed, fingerprint digest " + digest + ".");
          JS
      - name: Open or update the tracking issue
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const fs = require("fs");
          const path = require("path");
          const esc = (s) => String(s).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
          const TITLE = "gitleaks sweep: secrets found in this repository's history";
          const LABEL = "gitleaks-sweep";
          const BOT = "github-actions[bot]";
          const api = process.env.GITHUB_API_URL + "/repos/" + process.env.GITHUB_REPOSITORY;
          const headers = { Authorization: "Bearer " + process.env.GH_API_TOKEN, Accept: "application/vnd.github+json",
                            "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json" };
          async function call(method, url, body) {
            const r = await fetch(url, { method: method, headers: headers, body: body === undefined ? undefined : JSON.stringify(body),
                                         signal: AbortSignal.timeout(30000) });
            const text = await r.text();
            if (!r.ok) { const e = new Error(method + " " + url + " answered HTTP " + r.status + ": " + text.slice(0, 300)); e.status = r.status; throw e; }
            return text ? JSON.parse(text) : null;
          }
          (async () => {
            const tmp = process.env.RUNNER_TEMP;
            const body = fs.readFileSync(path.join(tmp, "gitleaks-issue-body.md"), "utf8");
            const digest = fs.readFileSync(path.join(tmp, "gitleaks-issue-digest.txt"), "utf8").trim();
            // The label is a convenience for people; the issue is FOUND by title and creator, so a label that
            // could not be created never makes a second issue.
            try { await call("GET", api + "/labels/" + LABEL); }
            catch (e) {
              if (e.status !== 404) throw e;
              try { await call("POST", api + "/labels", { name: LABEL, color: "b60205", description: "Opened by the CI gitleaks sweep: secrets found in history" }); }
              catch (e2) { if (e2.status !== 422) throw e2; }
            }
            let issue = null;
            for (let page = 1; page <= 10 && !issue; page++) {
              const list = await call("GET", api + "/issues?state=open&creator=" + encodeURIComponent(BOT) + "&per_page=100&page=" + page);
              if (!Array.isArray(list) || list.length === 0) break;
              issue = list.find((i) => !i.pull_request && i.title === TITLE) || null;
            }
            if (!issue) {
              const made = await call("POST", api + "/issues", { title: TITLE, body: body, labels: [LABEL] });
              console.log("opened tracking issue #" + made.number + ": " + made.html_url);
              return;
            }
            const seen = String(issue.body || "").match(/gitleaks-sweep-digest: [0-9a-f]{64}/g) || [];
            const before = seen.length ? seen[seen.length - 1].slice(-64) : "";
            await call("PATCH", api + "/issues/" + issue.number, { body: body });
            if (before === digest) {
              console.log("updated tracking issue #" + issue.number + " in place: same findings as before, no comment.");
              return;
            }
            const runUrl = process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID;
            await call("POST", api + "/issues/" + issue.number + "/comments",
              { body: "The sweep's findings CHANGED (fingerprint digest " + digest + ", was " + (before || "none") + "). The list in the issue body is now current as of " + runUrl + "." });
            console.log("updated tracking issue #" + issue.number + ": findings changed, comment posted.");
          })().catch((e) => { console.log("::error::" + esc("could not open or update the gitleaks sweep tracking issue: " + e.message)); process.exit(1); });
          JS

  security:
    # C5 security gates — SCA (OSV-Scanner) + SAST (Semgrep OSS) + PowerShell (PSScriptAnalyzer),
    # then a best-effort MITRE ATT&CK enrichment. Replaces the retired third-party SCA job AND the fail-open
    # `dotnet list package --vulnerable` NuGet gate. red_team_review / the NPU code index are the CHEAP
    # first-pass TRIAGE layer that feeds these tools — they are NOT the gate (an embeddings index has no
    # CVE feed and no sound taint analysis). The three gates evaluate independently (`if: ${{ !cancelled() }}`)
    # so one failure never hides the others; each fails the job on its own findings.
    #
    # NO TOKEN, NO QUOTA, NO ACCOUNT: OSV uses osv.dev (GHSA+NVD); Semgrep OSS uses free registry
    # rulesets read-only. Nothing is uploaded to a third-party org and there is no private-test budget.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest   # a literal, never the CI_RUNS_ON expression: this repository is PUBLIC (see RUNNER SELECTION in the header)
    # 45, not the 30 the other jobs use: this job carries the Semgrep scan, and SEMGREP_TIMEOUT is a
    # PER-RULE PER-FILE budget of 300s with --timeout-threshold 0 (no cap on how many rules may spend
    # it). On a large repo that is a legitimately long scan, and the correct failure is a red gate with
    # findings, never a job killed mid-scan whose log says nothing about why. Raise this before ever
    # lowering SEMGREP_TIMEOUT.
    timeout-minutes: 45
    steps:
      # SHA-pinned (C4 + zizmor unpinned-uses); Dependabot github-actions bumps this.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # zizmor artipacked (medium) - no token left in .git/config for later steps

      # ---------- Suppressions: allowed only if SECURITY-REQUIREMENTS.md section 5 lists them (C5, Jacob 2026-10-29) ----------
      - name: Suppression inventory (C5, allowed only if listed)
        # Jacob's ruling of 2026-10-29: an inline or config suppression of a scanner finding is allowed only if a
        # row of the repo's SECURITY-REQUIREMENTS.md section 5 lists it, and a scanner config file that turns rules
        # off is refused outright, as the secrets job refuses a committed .gitleaks.toml. This step lists every
        # suppression in the TRACKED tree (git grep --cached and the index's own blobs, never the working tree, so
        # nothing a step or a checkout leaves on disk hides one or adds one), each read the way its scanner reads it:
        # Semgrep's inline marker (as Semgrep 1.172.0 reads it, in ANY file: a string literal or a line of prose is a
        # marker to Semgrep too) and the root .semgrepignore's lines; the root .gitleaksignore's fingerprints and the
        # root .trivyignore's ids; PSScriptAnalyzer's SuppressMessage; Roslyn's pragma, SuppressMessage, NoWarn,
        # WarningsNotAsErrors and analyzer config severity (the compilers' and build tools' own ids are not scanner
        # findings and are not counted); zizmor's and Trivy's inline ignore comments. Each must be named by a section 5
        # table row carrying `rule:<id>` and `path:<repo path>` or `path:<repo path>:<line>` code spans
        # (templates/README.md, "Suppression inventory"). It FAILS, naming each one with its file, line and rule, on: a
        # suppression no row lists; one that names no rule (it silences every rule where it sits, so no row can list
        # it); no SECURITY-REQUIREMENTS.md, or a section 5 it cannot parse, while a suppression exists; and a committed
        # Trivy config file, a Trivy ignore file other than the root .trivyignore, zizmor config,
        # PSScriptAnalyzerSettings.psd1, a .semgrepignore anywhere but the root, or a root .semgrepignore line that
        # pulls in another file. The Trivy and zizmor steps below are also given explicit settings, so neither reads a
        # refused file even when this step is red; the Trivy step reads the root .trivyignore from the index, the
        # copy this step lists.
        # It reads only committed files and runs nothing from the repository, so it runs first. The PowerShell copy in
        # ci-selfhosted.yml is the same logic, message for message; change the two together.
        # templates/tests/Test-SuppressionInventory.ps1 runs both against the same cases.
        if: ${{ !cancelled() }}
        run: |
          node - <<'EOF'
          const fs=require("fs"),path=require("path"),os=require("os"),{spawnSync}=require("child_process");
          // Workflow-command escaping for every value taken from the repository (a path, a line, a pattern): %, CR, LF.
          const esc=s=>String(s).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");
          const C5="(C5, Jacob 2026-10-29: allowed only if listed)";
          const fail=s=>{console.log("::error::"+esc(s));process.exit(1)};
          // Whitespace as Go, Rust and .NET trim it (the scanners' own trims), written out so both copies agree byte for byte.
          const WS="[\\t\\n\\v\\f\\r \\u0085\\u00A0\\u1680\\u2000-\\u200A\\u2028\\u2029\\u202F\\u205F\\u3000]";

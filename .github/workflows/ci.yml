            // workflow command.
            console.log(`npm lockfile integrity: ${esc(rf)}: lockfileVersion ${d.lockfileVersion}, ${tally.registry} registry tarball(s) that name their own package, ${tally.listed} git/file/link source(s) allowed by NPM_LOCK_ALLOWED_SOURCES, ${tally.workspace} workspace link(s), ${tally.bundled} bundled (inBundle) entr(y/ies) that npm unpacks from their parent's tarball unchecked, ${tally.unresolved} entr(y/ies) outside node_modules with no resolved URL (npm fetches nothing for those)${errs.length>before?`, ${errs.length-before} problem(s)`:""}.`)}

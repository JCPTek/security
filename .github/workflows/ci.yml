# CI: the secret scan and the security gates. This repository has no build code, only README.md and
# SECURITY.md (pointers to private vulnerability reporting), so it runs the template's scanning jobs and
# nothing else.
# SOURCE: dev-standards templates/ci-hosted.yml, origin/main a970a17 (2026-10-30; first adopted at cfa6e80,
# 2026-10-28). The triggers, concurrency, permissions, the security-gate env block and the `secrets`,
# `secrets-issue` and `security` jobs are the template's, unchanged except for runs-on.
# EVERY DIFFERENCE FROM THE TEMPLATE:
#   * the template's `dotnet` and `web` jobs are not carried: there is no .NET project and no frontend
#     here, so they would have nothing to build or test. The PR that adds product code adopts its build
#     jobs from the template then.
#   * the template's EDIT PER REPO env block carries only what the `security` job reads: DISTRIBUTION
#     (shipped), LICENSE_TARGET ("") and LOCKFILE_GATE_EXCLUDE (""). DOTNET_TARGET, TEST_TARGET,
#     TEST_ALLOW_ZERO and FRONTEND_DIR are not carried: only those two jobs read them.
#   * two header comments that described those two jobs are reworded to match: the npm audit note in
#     C5 and the list of jobs that skip the schedule in SECRET-SCAN SCOPE.
#   * runs-on is the literal `ubuntu-latest` on every job, never the template's CI_RUNS_ON expression,
#     because this repository is PUBLIC. RUNNER SELECTION and NO PERSISTENT-RUNNER HARDENING below are
#     rewritten to say so, and each runs-on line carries its own comment.
# On a pull request the checks are `secrets` and `security`. `secrets-issue` acts only on the weekly
# sweep or a manual dispatch, so a pull request shows it as skipped.
# This history has no octopus merge, and it was pre-scanned with `--all --remerge-diff` on 2026-10-28
# before adopting the scan, as ADOPTING THIS TEMPLATE below asks: 1 commit, 1 scanned, no leaks.
#
# RUNNER SELECTION, THIS REPO'S AND NOT THE TEMPLATE'S: every job runs on GitHub-hosted `ubuntu-latest`,
# written as a literal. The template's runs-on is ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }},
# which a CI_RUNS_ON variable can point at a self-hosted pool. This repository is PUBLIC: anyone can open
# a pull request against it, and a pull request from a fork must never run on a self-hosted runner. The
# organization CI_RUNS_ON variable is scoped to private repositories and the pool's runner group refuses
# public ones; the literal takes the variable out of the question, so no repository or organization
# variable can move these jobs. ubuntu-latest is a fresh X64 VM per job and carries bash, git >= 2.43,
# curl, tar + gzip, sha256sum, node, python3-venv and pwsh. Scanners the runner image preinstalls are
# never used: every scanner is downloaded and verified here, or, for Semgrep, pip-installed from the
# hash-pinned list embedded in its step into a virtual environment of the job's own. The env block's
# *_ARM64 pins stay as the template ships them and go unused here.
#
# C5 (security gates): the `security` job runs SCA (OSV-Scanner) + SAST (Semgrep OSS) + PowerShell
# (PSScriptAnalyzer). It REPLACES the retired third-party SCA job AND the old fail-open `dotnet list package
# --vulnerable` NuGet gate — both did SCA, and OSV-Scanner supersedes them because its exit code is
# trustworthy (0 clean / 1 vulnerabilities / anything else = the scan could not run), so the gate keys
# off the exit code, never scraped console prose. Dependabot (templates/dependabot.yml) files the
# dependency-update PRs. The template's second npm check, `npm audit` in its web job, is not carried here.
# INHERITED-FINDING BASELINES (C5): a repo red on inherited findings baselines them, in a PR of its own,
# in the osv-scanner.toml beside each lockfile: one [[IgnoredVulns]] entry per finding with its id, a
# reason and an ignoreUntil (at most 7 days out for a critical, 30 for any other severity). OSV-Scanner
# honours the file natively. npm audit has no ignore file, so the web job's npm audit step reads the same
# osv-scanner.toml of its npm project directory, from the COMMITTED tree (HEAD), never the working tree that
# `npm ci` has run in: it passes on high/critical advisories only when EVERY one
# is named by GHSA id in an ACTIVE entry (a reason and an unexpired ignoreUntil at most 7 days out for an
# advisory npm rates critical, 30 for any other), with a ::warning:: per baselined id. The 7-day limit is
# ENFORCED for npm advisories (npm audit knows the severity) and, for findings only OSV-Scanner reports, by
# review of the baseline PR (osv-scanner.toml carries no severity). A baseline file is held to a STRICT
# ALLOWLIST grammar: comments and [[IgnoredVulns]] entries of exactly id = "...", reason = "..." and
# ignoreUntil = <RFC 3339 date-time with Z or an offset, later than 2020-01-01T00:00:00Z>, one per line;
# anything else (any other table, [[PackageOverrides]] included: no whole-package ignores; root keys;
# arrays; bare dates; ...) makes the whole file malformed. The `security` job's "Baseline file check" fails
# closed on a malformed file, and on any entry whose ignoreUntil is more than 30 days out; the npm audit
# step honours nothing in a malformed file. An expired entry turns OSV-Scanner and npm audit red again.
# SUPPRESSIONS (C5, Jacob's ruling 2026-10-29: allowed only if listed): the `security` job's first step after checkout,
# the Suppression inventory, lists every inline or config suppression of a scanner finding in the TRACKED tree and
# fails unless a row of the repo's SECURITY-REQUIREMENTS.md section 5 lists it, by `rule:<id>` and
# `path:<repo path>[:<line>]` code spans (templates/README.md, "Suppression inventory", has the convention and
# what counts). A suppression that names no rule always fails. Trivy config files, every Trivy ignore file
# but the root .trivyignore (each of whose ids needs a row too), zizmor config,
# PSScriptAnalyzerSettings.psd1 and a .semgrepignore anywhere but the root are refused outright. Before adopting,
# run the step's script in a clone of the repo and add a row for each suppression it lists, in a PR of its own.
#
# TRIGGER STRATEGY: push runs ONLY for the default branch (on.push.branches is the FIXED list
# [main, master] on ONE marker line, byte-identical across the fleet); every other change runs through
# the pull_request trigger, plus workflow_dispatch and the weekly schedule. A feature-branch push no
# longer runs CI by itself - its commits are scanned by the PR that proposes them - so total runs go
# down. The secrets job FAILS CLOSED on every event if the repository's default branch is not in that
# list, because then a push to the default branch would run NOTHING (the no-run gap). A tag push does
# not run this workflow: with only `branches:` under push, GitHub does not fire it for tags. The secrets
# job also FAILS CLOSED if `push:` carries any key but `branches:` (tags, paths, paths-ignore,
# branches-ignore, ...): each changes which pushes run CI, so the list would no longer be the whole answer.
# DEFAULT BRANCH SOURCE, DELIBERATELY DIFFERENT FROM ci-selfhosted.yml (security gate ruling 2026-09-26):
# this template's no-run-gap check reads the default branch from the event payload only;
# ci-selfhosted.yml reads it from the REST API with the payload as a cross-check. Both are deliberate. Do
# not "align" them in either direction.
# NO PERSISTENT-RUNNER HARDENING HERE, AND WHY: ubuntu-latest is a fresh VM per job, so no earlier job can
# leave git config, attribute files or refs/replace behind (ci-selfhosted.yml neutralises and refuses
# those).
# What a fresh VM does not cover is code that runs in THIS job before the scan: as shipped the
# secrets job runs nothing from the repository before gitleaks (checkout, then this template's own
# checks). Never add a step that runs repository code (a build, a script, a local action) ahead of the
# scan in this job: it could write .git/info/attributes, git config or refs/replace and blind the scan.
# SECRET-SCAN SCOPE BY EVENT, every arm with --remerge-diff (a secret typed into a merge CONFLICT
# RESOLUTION, present in neither parent, is scanned; git >= 2.43 is asserted): a push to the default
# branch scans its FULL HISTORY (HEAD), not the pushed range; a pull_request scans the proposed range
# (origin/<base>..HEAD); the weekly schedule (and a manual workflow_dispatch) scans EVERY REF IN THE
# CLONE (--all), so a NEWER gitleaks ruleset gets applied to history that already passed under the old
# rules INCLUDING branches nobody has pushed to since. The security job skips the scheduled run.
#
# ADOPTING THIS TEMPLATE (per repo, and again on every GITLEAKS_VERSION bump):
#   * --remerge-diff reads merge resolutions no earlier scan read, so pre-scan first. Use git >= 2.43, or
#     the pre-scan can false-clean (git 2.41/2.42 crash under --remerge-diff with GIT_ATTR_SOURCE, and
#     gitleaks still exits 0):
#     `GIT_ATTR_SOURCE=$(git hash-object -t tree /dev/null) GIT_ATTR_NOSYSTEM=1 XDG_CONFIG_HOME=$(mktemp -d)
#     gitleaks git . --no-banner --redact --log-level debug --report-path pre.json
#     "--log-opts=--all --remerge-diff" 2> pre.log` (the attribute handling the scan uses). The pre-scan
#     counts only if `grep -E 'DBG.*executing: .* log -p' pre.log` matches (gitleaks really started git,
#     so the next check is live) and `grep -E 'command aborted|exit status' pre.log` does not. Triage the
#     findings in merge commits, rotate the real ones, and add the fingerprints of confirmed false ones
#     to .gitleaksignore exactly as the scan prints them (a remerge-diff finding's path carries a `b/`
#     prefix). Time that --all sweep on the repo against this job's 30-minute timeout.
#     Count octopus merges first: `git rev-list --all --min-parents=3 --count`. Any above 0 turns the
#     sweep red permanently (the scan fails closed on them), so decide how to handle them BEFORE adopting.
#   * The secrets job REFUSES (exit 2) a .gitleaks.toml tracked anywhere in the tree (any case) or present
#     at the root, a GITLEAKS_CONFIG or GITLEAKS_CONFIG_TOML variable, and any line its scope ADDS that
#     carries gitleaks' inline allow comment: each lets a pull request silence the scan of its own change.
#     Before adopting, turn a .gitleaks.toml's allowlisted findings into .gitleaksignore fingerprints and
#     delete the file, and count the inline allow comments history already adds:
#     `m=gitleaks; git log -p -U0 --remerge-diff --format=%H --all | grep '^+' | grep -cF "$m:allow"`.
#     A push scans the default branch's full history and the sweep every ref, so each one keeps them red
#     until a SECURITY-REQUIREMENTS.md section 5 row lists it (Jacob 2026-10-30): `rule:gitleaks-allow` and
#     `path:<commit>:<file>:<line>`, the full id of the commit that adds the line and its line number
#     there, with the reason (templates/README.md, ".gitleaksignore"). Check first that none holds a live
#     secret; delete the comments from the tree, and fingerprint a line gitleaks then flags.
#   * Require CODEOWNERS review on .github/workflows/** and .gitleaksignore: gitleaks trusts whatever
#     ignore file the pull request itself supplies.
#   * npm lockfiles: the security job's npm lockfile integrity gate fails on every `resolved` URL that is not a
#     registry.npmjs.org tarball of the entry's own name and version, on every git, file or link entry but an npm
#     workspace link, and on every installed entry whose name is not its folder's, unless the env block allows it.
#     Before adopting, list what the repo's lockfiles resolve from outside the registry:
#     `git ls-files -z '*package-lock.json' '*npm-shrinkwrap.json' | xargs -0 grep -ho '"resolved": "[^"]*' |
#     grep -v '"https://registry.npmjs.org/' | sort -u`, and the aliases they install (folder=name):
#     `git ls-files -z '*package-lock.json' '*npm-shrinkwrap.json' | xargs -0 node -e 'for(const f of
#     process.argv.slice(1))for(const[k,e]of Object.entries(JSON.parse(require("fs").readFileSync(f)).packages)){const
#     i=k.lastIndexOf("node_modules/");if(i>=0&&!e.link&&e.name&&e.name!==k.slice(i+13))console.log(k.slice(i+13)+"="+
#     e.name)}' | sort -u`. Map a repo's own scope on another registry in NPM_LOCK_SCOPE_HOSTS
#     ("@your-org=npm.pkg.github.com" for GitHub Packages), list each git source by its URL without the #commit and
#     each file: or link entry exactly in NPM_LOCK_ALLOWED_SOURCES, and each alias in NPM_LOCK_ALIASES, in the same PR.
#   * .NET SDK: the dotnet job installs the SDK a repo-root global.json pins when there is one
#     (setup-dotnet's global-json-file), else the newest 10.0 SDK. A repo using PublishSingleFile,
#     PublishTrimmed or PublishAot, or any other reference the SDK adds implicitly at its own bundled
#     runtime version (Microsoft.NET.ILLink.Tasks for those three), MUST commit a global.json pinning the
#     SDK, e.g. {"sdk": {"version": "10.0.403", "rollForward": "disable"}}: that version is in
#     packages.lock.json, so under the newest SDK every SDK patch breaks the locked restore with NU1004.
#     Use "disable": the default, latestPatch, rolls onto a newer patch of the same band that the runner
#     image preinstalls. Bump the SDK in one reviewed change, global.json and the regenerated lockfile
#     together.
#   * Semgrep: the repository commits NO requirements file. The Semgrep step carries its hash-pinned list
#     embedded (generated in dev-standards from templates/semgrep-requirements.txt; never edit the block by
#     hand) and fails closed when it does not pin semgrep==SEMGREP_VERSION. To bump Semgrep: dev-standards
#     regenerates the file (scripts/semgrep-requirements.py), rewrites the blocks (--rewrite-blocks), updates
#     templates/osv-scanner.toml and bumps SEMGREP_VERSION; each repo then re-syncs this template's Semgrep
#     step and SEMGREP_VERSION together.
# KNOWN RESIDUALS OF THIS DESIGN (ruled; named so nobody mistakes them for coverage):
#   * push runs only for [main, master]: a secret on a branch that is force-pushed away before any PR
#     or weekly sweep reads it is never reported.
#   * no merge_group trigger: a repo that turns on a merge queue must add one, or the queue stalls.
#   * pull_request runs on its default types (opened, synchronize, reopened); `edited`, which covers a
#     base-branch change, does not re-run the scan.
#   * the tag arm is unreachable as shipped (no `tags:` filter, and adding one fails the no-run-gap
#     check); commits reachable only from a tag are covered by the weekly --all sweep.
#   * an octopus merge (3+ parents) cannot be re-merged, so the scan fails closed on one (exit 2).
name: CI

on:
  push:
    branches: [main, master]   # ci-push-branches-marker: FIXED, one line; the secrets job fails closed unless the default branch is listed here
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — full-history secret scan

concurrency:
  # Estate rule: cancel SUPERSEDED pull_request runs only, NEVER a default-branch push, a dispatch or a
  # schedule run. A pull_request run shares its group with newer runs of the same PR (the ref is
  # refs/pull/<n>/merge) and is cancelled by them. Every other event gets a group of its own (its run_id),
  # so nothing cancels it and it cancels nothing - a cancelled run is not evidence in either direction.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # ---- EDIT PER REPO ----
  # DISTRIBUTION: REQUIRED, no default. shipped = anything built here reaches a customer or any other third party (an app,
  # a site, a package); internal = nothing built here ever leaves the org (tooling). The security job's license gate fails
  # while it is unset, and judges every package as shipped until it is. Only an internal repo may take an internal-only
  # license exception; a restricted package fails a shipped repo whatever the exceptions file says (templates/README.md).
  DISTRIBUTION: shipped              # shipped | internal. shipped, as the planner listed it (no build code; the gate scans 0 packages here)
  # OPTIONAL extra: the license gate scans EVERY tracked project's packages.lock.json and every npm lockfile; this only adds
  # back a project LOCKFILE_GATE_EXCLUDE leaves out ('|'-separated). It no longer chooses what is scanned.
  LICENSE_TARGET: ""
  # Space-separated globs whose *.csproj is exempt from the J6 lockfile-presence gate (H1 config).
  # DEFAULT EMPTY: the only legitimate use is a project that is never restored, built, or shipped -
  # an analyzer/Semgrep fixture csproj. Anything that builds needs a lockfile, exemption or not.
  LOCKFILE_GATE_EXCLUDE: ""          # e.g. "tests/fixtures/*.csproj samples/Broken/*.csproj"
  # npm lockfile integrity gate (J6, the `security` job; H1 config). Every package-lock.json /
  # npm-shrinkwrap.json entry with a `resolved` URL must be https, from registry.npmjs.org or a host mapped
  # below, and name the entry's OWN name and version. All three DEFAULT EMPTY: an extra source is a decision
  # someone has to write down.
  # NPM_LOCK_SCOPE_HOSTS: space-separated @scope=host pairs for a repo's OWN scopes on another registry. Every
  # entry in a listed scope must resolve from its host, and that host serves no other name, so neither can
  # stand in for the other (the internal-scope pin J6 asks for). GitHub Packages' download path is understood.
  NPM_LOCK_SCOPE_HOSTS: ""           # e.g. "@your-org=npm.pkg.github.com"
  # NPM_LOCK_ALLOWED_SOURCES: space-separated git, file and link sources allowed as they are: a git source by
  # its URL without the #commit (git+ssh:// or git+https://, pinned to a full commit hash in the lockfile), a
  # file: or link entry by its exact `resolved` value. Every other git, file or link entry fails.
  NPM_LOCK_ALLOWED_SOURCES: ""       # e.g. "git+ssh://git@github.com/your-org/shared-lib.git ../sibling-pkg"
  # NPM_LOCK_ALIASES: space-separated folder=name pairs, each a node_modules folder that holds a package of ANOTHER
  # name, as an npm: alias dependency records it ("string-width-cjs": "npm:string-width@^4.2.0" gives
  # string-width-cjs=string-width). Every other entry whose name is not its folder's fails, because npm installs that
  # package where code require()s the folder's. Likely entries, from @isaacs/cliui: string-width-cjs=string-width
  # strip-ansi-cjs=strip-ansi wrap-ansi-cjs=wrap-ansi.
  NPM_LOCK_ALIASES: ""               # e.g. "string-width-cjs=string-width strip-ansi-cjs=strip-ansi wrap-ansi-cjs=wrap-ansi"
  # ---- SECURITY-GATE CONFIG (C5) — tool versions/thresholds are config, never hardcoded in logic (H1) ----
  # OSV-Scanner scans the WHOLE checkout recursively, so every manifest that ships is covered without a
  # per-project scope knob — the old CVE_TARGETS problem (a scan that walks only one project's closure)
  # cannot occur. NuGet needs a committed packages.lock.json (RestorePackagesWithLockFile=true) for
  # transitive coverage; without one only direct PackageReferences resolve. Versions verified current
  # 2026-08-07 (google/osv-scanner v2.5.0) and 2026-10-29 (Semgrep OSS 1.181.0); Dependabot does not bump these: bump deliberately.
  OSV_SCANNER_VERSION: "2.5.0"
  # Fail at or above this CVSS band: any | low | medium | high | critical. `any` = fail on every finding
  # (the default and the right posture); a package group whose CVSS score is missing always counts as a finding.
  OSV_SEVERITY_THRESHOLD: any
  SEMGREP_VERSION: "1.181.0"
  # Registry rulesets (space-separated, free, no token). The step ALSO auto-adds `--config .semgrep/` when the
  # repo has a .semgrep/ dir (the security-coding rollout drops canonical custom rules there), absent-safe.
  SEMGREP_CONFIG: p/default   # e.g. "p/security-audit p/secrets p/csharp p/javascript p/typescript"
  # THERE IS NO SEVERITY KNOB, DELIBERATELY. `--severity` FILTERS rather than setting a floor, so a
  # single-severity run does not contain the other severities at all. The step therefore asks for BOTH
  # in ONE scan (`--severity ERROR --severity WARNING`) and decides from the JSON report: ERROR results
  # FAIL the job, WARNING results are echoed as ::warning:: annotations and never block. The policy is
  # fixed because it is the standard (C5), not a per-repo preference; INFO is not requested at all.
  # Semgrep's default per-rule timeout is 5s. A rule that exceeds it on one file is ABANDONED for that
  # file and the run still exits 0 with no finding from it: a green check produced by not looking. It
  # hid a real ERROR plus three LDAP DN-concat findings in a service in this fleet. --timeout-threshold 0
  # removes the "skip the whole file after N timed-out rules" cap, so a slow file is never dropped
  # wholesale either. 300s is not padding: taint-mode rules on a 1-2k line C# file exceed 30s, and the
  # file is then counted clean. Both are config (H1); raise the timeout, never shrink the coverage.
  SEMGREP_TIMEOUT: "300"          # per-rule, per-file seconds. Integer.
  SEMGREP_TIMEOUT_THRESHOLD: "0"  # 0 = no limit on timed-out rules per file. Integer.
  PSSA_VERSION: "1.24.0"      # PSScriptAnalyzer; only runs on repos containing .ps1/.psm1
  PSSA_SECURITY_RULES: ""     # '' => the curated security-rule default in the step; override to tune
  # ---- IaC / workflow SAST gate config (added 2026-08-08; H1 config-driven) ----
  GITLEAKS_VERSION: "8.30.1"       # secret scanner; the SAME pin ci-selfhosted.yml uses. Verified current 2026-08-08
  TRIVY_VERSION: "0.73.0"          # Trivy IaC/misconfig scanner. Verified current 2026-08-08
  TRIVY_SEVERITY: "HIGH,CRITICAL"  # comma-separated Trivy severities that FAIL the config gate
  ZIZMOR_VERSION: "1.29.0"         # zizmor GitHub Actions workflow-security auditor. Verified current 2026-08-08
  ZIZMOR_MIN_SEVERITY: medium      # gate at/above this zizmor severity; 'medium' catches template-injection,
                                   # unpinned-uses AND artipacked. VERIFIED against zizmor 1.29.0, do not assume
                                   # otherwise: its unpinned-uses policy is BLANKET - `actions/checkout@v4` is a HIGH
                                   # finding just like any third-party tag, so EVERY `uses:` below is pinned to a
                                   # commit SHA; and artipacked (medium) fires on any checkout omitting
                                   # persist-credentials:false, so every actions/checkout below sets it. This
                                   # template passes its own gate at 'medium' (verified 2026-08-08).
  ACTIONLINT_VERSION: "1.7.12"     # actionlint workflow-correctness linter (best-effort, non-gating). Verified 2026-08-08
  # ---- SHA-256 of every binary DOWNLOADED FROM A GITHUB RELEASE (CI-audit HIGH#1). Each ARCHIVE is verified
  #      BEFORE the binary is extracted or executed; a mismatch FAILS the job closed. A hosted runner (and a
  #      CI_RUNS_ON pool runner, which must be one-job) is ephemeral, so there is no tool cache to poison and the fresh download is re-verified on every run - but a
  #      compromised release asset, a poisoned mirror or a MITM'd download is caught here all the same, and it
  #      makes the supply chain auditable: every downloaded executable is pinned by CONTENT, not just a version
  #      tag. Tools installed by a PACKAGE MANAGER are version-pinned but NOT hash-verified - see the residual-risk
  #      note below. Bump each hash (BOTH architectures) WITH its version above.
  #      Provenance: the published release checksum file for osv-scanner / gitleaks / Trivy / actionlint;
  #      zizmor publishes no checksum file, so its pin is the SHA-256 of the release asset itself, computed
  #      at pin time (2026-08-08). ----
  #      ARCHITECTURE: each download step picks its release asset AND its pin by RUNNER_ARCH: X64 (ubuntu-latest)
  #      takes *_SHA256, ARM64 (an arm64 CI_RUNS_ON pool) takes *_SHA256_ARM64, and any other value fails the
  #      step closed before anything is downloaded. The ARM64 pins (added 2026-10-28) are for the SAME versions,
  #      from the same official checksum files; zizmor's is the GitHub release-asset digest, confirmed by
  #      downloading the asset and hashing it.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"      # gitleaks_8.30.1_linux_x64.tar.gz
  GITLEAKS_SHA256_ARM64: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"  # gitleaks_8.30.1_linux_arm64.tar.gz
  OSV_SCANNER_SHA256: "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c"   # osv-scanner_linux_amd64 (v2.5.0)
  OSV_SCANNER_SHA256_ARM64: "fe152e1a546af223e6c557cc3111a8bb3e5dc02fcbf7dbe95d26567c0f0041f2"  # osv-scanner_linux_arm64 (v2.5.0)
  TRIVY_SHA256: "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b"         # trivy_0.73.0_Linux-64bit.tar.gz
  TRIVY_SHA256_ARM64: "13833d97e8a1a5367471c372a173180157f593bece570e20d5d925fef552f5dd"   # trivy_0.73.0_Linux-ARM64.tar.gz
  ZIZMOR_SHA256: "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839"        # zizmor-x86_64-unknown-linux-gnu.tar.gz (v1.29.0)
  ZIZMOR_SHA256_ARM64: "415eaa7c0a06479a701b8e44a3e812c1047decc848ec4bede7bd6bbf49f22d20"  # zizmor-aarch64-unknown-linux-gnu.tar.gz (v1.29.0)
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"    # actionlint_1.7.12_linux_amd64.tar.gz
  ACTIONLINT_SHA256_ARM64: "325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"  # actionlint_1.7.12_linux_arm64.tar.gz
  # ---- DOWNLOAD RETRY: the TRANSFER is retried, never the verification. Every pinned-binary download in this
  #      file (gitleaks, osv-scanner, Trivy, zizmor, actionlint) is
  #      `curl -sSfL --connect-timeout 10 --speed-limit 1024 --speed-time 30 --retry 3 --retry-all-errors
  #      --retry-delay 2 --retry-max-time 60`. An attempt fails when it cannot connect within 10 s, or when it
  #      moves less than 1024 bytes/s for 30 s in a row (a server that never answers, or answers and then
  #      stalls); a slow but moving download is NOT cut off, since there is no total time cap. A failed attempt
  #      (a 5xx, a reset, a stall) is retried up to 3 times, 2 s apart, and no retry starts once 60 s have
  #      passed, so a persistent outage or a stalled mirror fails the step closed in about a minute (a stall:
  #      two 30 s attempts). --fail (the f in -sSfL) stays, so an HTTP error is a failed attempt, never an error
  #      page saved as the archive. The SHA-256 check above runs ONCE, after the transfer, and is never
  #      retried: a mismatch is a signal, not a blip. semgrep is installed by pip (with pip's own retries), not
  #      downloaded here, and its hashes are checked by pip against the list embedded in its step. ----
  # RESIDUAL RISK (CI-audit MED): one tool is installed by a PACKAGE MANAGER and is version-pinned but NOT
  #   hash-verified - the package manager resolves and runs it: PSScriptAnalyzer (Install-Module, PSGallery). The
  #   license gate installs nothing (it reads the lockfiles and nuget.org's package metadata itself); nuget-license and
  #   license-checker now run only in release.yml's THIRD-PARTY-NOTICES step. Semgrep is no longer one of
  #   them: pip installs it and every transitive dependency from the hash-pinned list embedded in its step,
  #   with --require-hashes and --only-binary :all: (each wheel pinned by SHA-256, each release >= 14 days old,
  #   or >= 72 hours for an advisory fix under C3's security-fix exception).
  #   Content-pinning them would mean vendoring or a lockfile per tool; accepted as residual risk because each
  #   pulls from a first-party registry over TLS and is version-pinned. Revisit if a registry compromise is in scope.
  # Path to the local-ai CLI (local_ai_cli.py) for the ATT&CK enrichment. Instance-specific, so it is
  # config not a literal (H1); unset on hosted/service-account runners, where the enrichment self-skips.
  LOCALAI_CLI: ""

jobs:
  secrets:
    runs-on: ubuntu-latest   # a literal, never the CI_RUNS_ON expression: this repository is PUBLIC (see RUNNER SELECTION in the header)
    timeout-minutes: 30
    outputs:
      # "true" when the secret scan FOUND secrets (its exit 1). Read by secrets-issue, below, on a sweep.
      found: ${{ steps.gitleaks.outputs.found }}
    steps:
      # SHA-pinned (C4 + zizmor unpinned-uses); Dependabot github-actions bumps this.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          # persist-credentials:false (zizmor artipacked, medium) - keep the GITHUB_TOKEN out of .git/config so a
          # later step cannot read it. gitleaks still scans full LOCAL history (the object store), so unaffected.
          persist-credentials: false
          # `fetch-depth: 0` IS THE GATE, not a tuning knob (C1). actions/checkout defaults to depth 1,
          # and gitleaks can only scan the commits it was given: at depth 1 it sees the tip and nothing
          # else, so a credential that was committed and later deleted — the exact thing history
          # scanning exists to catch — is invisible while the check still reports GREEN. A shallow
          # secret scan is a scan of nothing. NEVER remove this line or lower the value.
          fetch-depth: 0
      - name: Assert the push trigger covers the default branch (no-run gap)
        # on.push.branches is a FIXED list ([main, master], the marker line at the top of this file). If
        # the repository's default branch is not in it, a push to the default branch runs NOTHING: no
        # red check, no green check, only an absence nobody notices. No step can run on a push that
        # never fires, so this one runs on EVERY event that does (pull_request, workflow_dispatch,
        # schedule, pushes to a listed branch) and fails there. It also fails when the marker line is
        # missing, duplicated or not directly under `push:`, or when `push:` has any key but `branches:`
        # (tags, paths, paths-ignore, branches-ignore, ... each changes which pushes run), because then
        # the list it checks is not provably the list GitHub reads.
        # DELIBERATELY DIFFERENT SOURCE FROM ci-selfhosted.yml (security gate ruling 2026-09-26): see the
        # header.
        # WHERE THE DEFAULT BRANCH COMES FROM: the event payload, github.event.repository.default_branch,
        # and nothing else. Measured resolving on push, tag push, pull_request, workflow_dispatch AND
        # schedule. There is deliberately no fallback: an empty value on ANY event FAILS CLOSED, because
        # an unresolved default branch is not a pass. Every refusal here exits 2 (could not run), never
        # 1, which the scan step reserves for "found secrets".
        env:
          PAYLOAD_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -e
          default_branch="${PAYLOAD_DEFAULT_BRANCH:-}"
          source="event payload (github.event.repository.default_branch)"
          if [ -z "$default_branch" ]; then
            echo "::error::the repository's default branch did not resolve on this $GITHUB_EVENT_NAME event (github.event.repository.default_branch is empty), so this step cannot show that a push to the default branch runs CI at all. FAILING CLOSED: an unresolved default branch is not a pass."
            exit 2
          fi
          echo "default branch: '$default_branch' (source: $source)."
          # This workflow's own file: GITHUB_WORKFLOW_REF is <owner>/<repo>/<path>@<ref>.
          wf="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}"
          wf="${wf%%@*}"
          if [ ! -f "$wf" ]; then
            echo "::error::cannot read this workflow's own file '$wf' (from GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF), so the push list cannot be checked. FAILING CLOSED."
            exit 2
          fi
          # THE MARKER LINE: an uncommented `branches: [...]` key carrying the marker comment. Exactly one.
          marker_re='^[[:space:]]+branches:[[:space:]]*\[[^]#]*\][[:space:]]+#[[:space:]]*ci-push-branches-marker'
          n=$(grep -cE "$marker_re" "$wf" || true)
          if [ "$n" != "1" ]; then
            echo "::error::expected exactly ONE push-branches marker line (branches: [...]  # ci-push-branches-marker) in $wf, found $n. Without exactly one, the push list this step checks is not provably the list GitHub reads. FAILING CLOSED - restore the marker line from templates/ci-hosted.yml."
            exit 2
          fi
          lineno=$(grep -nE "$marker_re" "$wf" | cut -d: -f1)
          # The nearest preceding non-blank, non-comment line must be `push:`, or the marker sits under
          # some other trigger and the real push filter is elsewhere.
          prev=$(awk -v n="$lineno" 'NR < n && $0 !~ /^[[:space:]]*(#|$)/ { p = $0 } NR == n { print p; exit }' "$wf")
          if ! printf '%s\n' "$prev" | grep -qE '^[[:space:]]+push:[[:space:]]*$'; then
            echo "::error::the push-branches marker line (line $lineno of $wf) is not directly under 'push:' (the line above it is '$prev'), so it is not the push filter. FAILING CLOSED."
            exit 2
          fi
          # `push:` MAY CARRY `branches:` AND NOTHING ELSE. Any other key (tags, tags-ignore, paths,
          # paths-ignore, branches-ignore, ...) changes which pushes run this workflow, so the list would no
          # longer be the whole answer. Every line indented deeper than `push:` up to the next line that is
          # not is inside it; each at the first child indentation must be the one `branches:` key.
          pushno=$(awk -v n="$lineno" 'NR < n && $0 !~ /^[[:space:]]*(#|$)/ { p = NR } NR == n { print p; exit }' "$wf")
          awk -v s="$pushno" '
            NR == s { match($0, /^[[:space:]]*/); pind = RLENGTH; next }
            NR > s {
              if ($0 ~ /^[[:space:]]*(#|$)/) next
              match($0, /^[[:space:]]*/); ind = RLENGTH
              if (ind <= pind) exit
              if (cind == "") cind = ind
              if (ind == cind) {
                k = substr($0, ind + 1)
                if (k ~ /^[^[:space:]#:][^#:]*:([[:space:]]|$)/) sub(/[[:space:]]*:.*$/, "", k)
                print k
              }
            }' "$wf" > "$RUNNER_TEMP/push-keys.txt"
          push_keys=$(tr '\n' ',' < "$RUNNER_TEMP/push-keys.txt" | sed 's/,$//')
          n_branches=$(grep -cx 'branches' "$RUNNER_TEMP/push-keys.txt" || true)
          n_other=$(grep -cvx 'branches' "$RUNNER_TEMP/push-keys.txt" || true)
          if [ "$n_branches" != "1" ] || [ "$n_other" != "0" ]; then
            echo "::error::on.push in $wf must carry exactly one key, branches:, and nothing else; found [$push_keys]. A tags, paths, paths-ignore or branches-ignore key changes which pushes run this workflow, so the push list is no longer the whole answer. FAILING CLOSED."
            exit 2
          fi
          list=$(sed -n "${lineno}p" "$wf" | sed -E 's/^[^[]*\[([^]]*)\].*$/\1/')
          printf '%s\n' "$list" | tr ',' '\n' > "$RUNNER_TEMP/push-branches.txt"
          found=""
          negated=""
          while IFS= read -r item; do
            item=$(printf '%s' "$item" | sed -E "s/^[[:space:]\"']+//; s/[[:space:]\"']+\$//")
            if [ "$item" = "$default_branch" ]; then found=1; fi
            case "$item" in '!'*) negated="$negated $item" ;; esac
          done < "$RUNNER_TEMP/push-branches.txt"
          # A negated entry ('!name') EXCLUDES branches, so a list carrying one no longer means "these run".
          if [ -n "$negated" ]; then
            echo "::error::the push-branches marker line (line $lineno of $wf) carries a negated entry [${negated# }], which excludes branches from CI. The list is FIXED at [main, master]. FAILING CLOSED."
            exit 2
          fi
          if [ -z "$found" ]; then
            echo "::error::NO-RUN GAP: the default branch '$default_branch' is not in on.push.branches [$list] (line $lineno of $wf), so a push to the default branch runs NO CI at all - not a red check, an absent one. FAILING CLOSED. Rename the default branch to main or master, or take this up as a template change; never edit the marker line per repo."
            exit 2
          fi
          echo "push list [$list] (line $lineno of $wf) contains the default branch '$default_branch': a push to it runs CI."
      - name: Assert git >= 2.43 (--remerge-diff on every arm; GIT_ATTR_SOURCE for the scan)
        # Two features the scan depends on, each with a minimum git: --remerge-diff (2.36), without which
        # merge conflict resolutions are not read, and GIT_ATTR_SOURCE (2.41, release notes 2.41.0 - NOT
        # 2.40), without which a checked-out .gitattributes marking a path -diff or binary blinds the
        # scan. An older git rejects the first (gitleaks then logs ERR and exits 0) and SILENTLY IGNORES
        # the second, so nothing downstream would notice. The floor is 2.43, not 2.41: git 2.41.x and
        # 2.42.x SEGFAULT under `log --remerge-diff` with GIT_ATTR_SOURCE at the first merge whose both
        # sides changed (upstream fix e95bafc52f, first shipped in 2.43.0), and gitleaks does not check
        # git's exit status, so the crash is a partial scan with rc 0 (measured with MinGit 2.42.0.2: the
        # resolution secret missed, green). The version is asserted HERE, before the scan, and a version
        # string this step cannot parse fails as well. Like every precondition step it exits 2 (could not
        # run).
        run: |
          raw=$(git --version)
          echo "$raw"
          ver=$(printf '%s\n' "$raw" | sed -nE 's/^git version ([0-9]+)\.([0-9]+)([^0-9].*)?$/\1 \2/p')
          if [ -z "$ver" ]; then
            echo "::error::cannot parse '$raw' as a git version, so support for --remerge-diff with GIT_ATTR_SOURCE (git >= 2.43) is unproven. FAILING CLOSED."
            exit 2
          fi
          major="${ver% *}"
          minor="${ver#* }"
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 43 ]; }; then
            echo "::error::git $major.$minor is older than 2.43. The scan needs --remerge-diff (2.36) to read merge conflict resolutions and GIT_ATTR_SOURCE (2.41) so a checked-out .gitattributes cannot hide paths from it, and git 2.41/2.42 crash when the two are combined (fixed in 2.43.0) while gitleaks exits 0 on a partial scan. FAILING CLOSED - use a runner with git >= 2.43."
            exit 2
          fi
          echo "git $major.$minor >= 2.43: --remerge-diff with GIT_ATTR_SOURCE is supported."
      - name: Assert full history (C1 — a shallow secret scan is a scan of nothing)
        # Belt and braces for the line above. `fetch-depth: 0` is one deletable line, and deleting it
        # degrades the scan SILENTLY — the job still passes, just having checked almost nothing. This
        # step turns that drift into a red build instead of a false green.
        # Exit 2 on every refusal here: a precondition that fails means the scan COULD NOT RUN, which is
        # never the same fact as exit 1 (the scan step's "found secrets").
        run: |
          shallow=$(git rev-parse --is-shallow-repository)
          if [ "$shallow" != "false" ]; then
            echo "::error::COULD NOT RUN: refusing to run a secret scan on a SHALLOW checkout (standard C1). This clone has no history, so the scan can only see the tip commit - a secret that was committed and later deleted would pass unnoticed, which is the entire reason history scanning exists. Restore 'fetch-depth: 0' on the actions/checkout step in this job."
            exit 2
          fi
          # A PARTIAL clone (actions/checkout `filter:`) has every commit but not every blob: git fetches
          # a missing blob lazily while gitleaks reads the log, and a failed lazy fetch surfaces only as an
          # ERR line under a gitleaks exit 0. Refused outright rather than trusted to fail loudly. Any
          # value of remote.origin.promisor other than a boolean false counts, so a malformed one fails too.
          promisor=$(git config --get remote.origin.promisor || true)
          promisor_bool=$(git config --type=bool --get remote.origin.promisor 2>/dev/null || true)
          partialclone=$(git config --get extensions.partialclone || true)
          if { [ -n "$promisor" ] && [ "$promisor_bool" != "false" ]; } || [ -n "$partialclone" ]; then
            echo "::error::COULD NOT RUN: this checkout is a PARTIAL clone (remote.origin.promisor='${promisor}', extensions.partialclone='${partialclone}'), so blobs the scan must read are fetched lazily and a failed fetch would pass as clean. Remove 'filter:' from the actions/checkout step in this job (standard C1)."
            exit 2
          fi
          # The number below is the SIZE OF THE CHECKED-OUT HISTORY, and it is labelled as such on
          # purpose: it is NOT how many commits the secret scan reads. That number exists only in
          # gitleaks' own log, and the scan step below prints it next to the rev-list size of the exact
          # scope it scanned. Quoting this count as "scanned" reports a scope the scan never measured.
          echo "Full history present: HEAD carries $(git rev-list --count HEAD) commits (git rev-list --count HEAD = checkout size, NOT the scanned count; the scan step reports gitleaks' own count) - the secret scan can see deleted secrets."
      - name: Gitleaks secret scan (full history)
        id: gitleaks
        # The CLI, NOT gitleaks/gitleaks-action, and identical to the ci-selfhosted.yml step (same
        # GITLEAKS_VERSION, same invocation) so a finding in one template is a finding in the other:
        #   * the action fetches its own gitleaks binary with no checksum we control - CI-audit HIGH#1
        #     requires every executable be content-pinned, and the CLI is the only way to do that here;
        #   * the action scans only the PUSHED RANGE on push events and full history only on schedule.
        #     This checkout is fetch-depth:0 and asserted above, so on a push the CLI scans the pushed
        #     branch's FULL history (--log-opts=HEAD) on EVERY run rather than one range on one event -
        #     strictly more coverage, and it removes the "did the schedule run?" dependency. A push run
        #     is not every ref in the clone (see SCOPE below for why that distinction is the point);
        #     the WEEKLY SCHEDULE is, so no branch escapes a newer ruleset just by sitting still;
        #   * the action needs GITLEAKS_LICENSE on an ORGANIZATION account. Free on a personal account
        #     today, a hard stop the day a repo moves into an org. The CLI has no such condition.
        run: |
          set -e
          # EXIT CODES OF THIS STEP: 1 = gitleaks FOUND secrets. 2 = the scan COULD NOT RUN, or ran and
          # produced a result this step cannot vouch for (download, gitleaks error, coverage checks
          # below). They are opposite facts that render as the same red check, so each path says which
          # one it is: a 2 is non-evidence to be fixed or re-run, never a finding to be rotated.
          ver="${GITLEAKS_VERSION:-8.30.1}"
          # Release asset AND pin by RUNNER_ARCH (see the env block): X64 = ubuntu-latest, ARM64 = an arm64
          # CI_RUNS_ON pool. Any other architecture has no pinned asset, so it fails closed BEFORE downloading.
          case "${RUNNER_ARCH:-}" in
            X64)   asset="gitleaks_${ver}_linux_x64.tar.gz";   want="$GITLEAKS_SHA256" ;;
            ARM64) asset="gitleaks_${ver}_linux_arm64.tar.gz"; want="$GITLEAKS_SHA256_ARM64" ;;
            *)
              echo "::error::gitleaks COULD NOT RUN: RUNNER_ARCH='${RUNNER_ARCH:-}' is neither X64 nor ARM64, so this template has no pinned gitleaks asset or SHA-256 for this runner. This is NOT a finding - nothing was scanned. FAILING CLOSED: run on ubuntu-latest or an X64/ARM64 CI_RUNS_ON pool."
              exit 2 ;;
          esac
          # Defence in depth: never compare against an empty or malformed pin (an empty want would match an empty hash).
          if ! printf '%s' "$want" | grep -Eq '^[0-9a-f]{64}$'; then echo "::error::gitleaks: the pinned SHA-256 for $asset is missing or malformed in the env block - refusing to download an unverifiable binary. FAILING CLOSED (C4/C5)."; exit 2; fi
          if ! curl -sSfL --connect-timeout 10 --speed-limit 1024 --speed-time 30 --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/${asset}" -o "$RUNNER_TEMP/gitleaks.tgz"; then
            echo "::error::gitleaks COULD NOT RUN: downloading gitleaks v${ver} ($asset) failed. This is NOT a finding - nothing was scanned. Re-run the job; if it persists, check the release URL and GITLEAKS_VERSION."
            exit 2
          fi
          # CI-audit HIGH#1: verify the pinned SHA-256 BEFORE extracting/executing.
          actual=$(sha256sum "$RUNNER_TEMP/gitleaks.tgz" | cut -d' ' -f1)
          if [ "$actual" != "$want" ]; then
            echo "::error::gitleaks COULD NOT RUN: download checksum mismatch for $asset: expected $want got $actual. Refusing to extract an unverified binary (CI-audit HIGH#1). This is NOT a finding. If GITLEAKS_VERSION was bumped, update GITLEAKS_SHA256 (X64) and GITLEAKS_SHA256_ARM64 (ARM64)."
            exit 2
          fi
          if ! tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks; then
            echo "::error::gitleaks COULD NOT RUN: extracting the verified archive failed. This is NOT a finding - nothing was scanned. Re-run the job."
            exit 2
          fi
          chmod +x "$RUNNER_TEMP/gitleaks"
          # SCOPE (C1). `gitleaks git .` with NO --log-opts walks EVERY ref the clone holds. That is
          # harmless on a throwaway hosted runner and catastrophic on a persistent one, where
          # refs/remotes/origin/* survives from every previous job: one real secret on one branch then
          # fails every unrelated PR until it is rewritten out (two repos in this fleet died this way on
          # a finding that belonged to neither). Both templates therefore scope the scan the same way,
          # so a finding here is a finding there.
          #
          # SCOPE IS PER EVENT, and the schedule is the one that must NOT be narrowed:
          #   * schedule / workflow_dispatch -> --log-opts=--all, EVERY ref in the clone, with NO stale-ref
          #     cleanup. This is the run whose entire purpose is applying a NEWER gitleaks ruleset to
          #     history that already passed under the old one, so scoping it to one branch would leave
          #     every other branch permanently graded by whatever ruleset was current the day it was
          #     pushed. Cleanup is skipped here for the same reason: it would delete exactly the refs
          #     this run exists to read.
          #   * tag push (GITHUB_REF_TYPE=tag) -> --log-opts=HEAD, no cleanup. Unreachable as shipped: GitHub
          #     does not fire this workflow for a tag, because only `branches:` is set, and a `tags:` key
          #     under push fails the no-run-gap check. Kept so both templates scope identically.
          #     GITHUB_REF_NAME is a TAG name on this event, so "refs/remotes/origin/$GITHUB_REF_NAME"
          #     matches nothing and the
          #     cleanup would drop every remote-tracking branch including the one the tag sits on.
          #   * pull_request -> origin/<base>..HEAD, the proposed range.
          #   * push (the default branch only, see on.push.branches) -> --log-opts=HEAD, the branch's FULL
          #     history (not the pushed range).
          #   Every arm adds --remerge-diff; see REMERGE-DIFF below.
          #
          # STALE-REF CLEANUP IS LOCAL ONLY, AND DELIBERATELY SO. The obvious version of this is
          # `git fetch --prune origin`, and it CANNOT WORK HERE: checkout ran with
          # persist-credentials:false, so .git/config carries no credential and any fetch against a
          # private repo exits 128 - which under `set -e` killed the whole step, and on the PowerShell
          # side did nothing at all while still claiming the refs had been pruned. Deleting the stale
          # refs this clone ALREADY HOLDS needs no network and no credential, and stale local refs are
          # the entire failure mode. Keep origin/HEAD AND WHAT IT POINTS AT (deleting the target leaves
          # the symref dangling, and every later `git` read of it then errors), this branch's own remote
          # ref, and (on a pull request) the base ref; drop the rest.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "stale remote-tracking refs: cleanup SKIPPED on $GITHUB_EVENT_NAME - this run scans every ref on purpose."
            scope="--all"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "stale remote-tracking refs: cleanup SKIPPED on a tag push - GITHUB_REF_NAME is a tag, so no remote-tracking branch is safe to key the keep-list on."
            scope="HEAD"
          else
            git for-each-ref --format='%(refname)' refs/remotes/origin > "$RUNNER_TEMP/remote-refs.txt"
            keep_list="refs/remotes/origin/HEAD"
            if [ -n "${GITHUB_REF_NAME:-}" ]; then keep_list="$keep_list refs/remotes/origin/${GITHUB_REF_NAME}"; fi
            # refs/remotes/origin/HEAD is a SYMREF. Keeping the symref while deleting its target leaves
            # it dangling, so resolve it and keep the target too.
            head_target=$(git symbolic-ref -q refs/remotes/origin/HEAD || true)
            # Added only if not already listed, so the keep list this step PRINTS matches the
            # PowerShell template's de-duplicated one - on a PR into the default branch, the symref
            # target and the base ref are the same ref.
            if [ -n "$head_target" ]; then
              case " $keep_list " in *" $head_target "*) ;; *) keep_list="$keep_list $head_target" ;; esac
            fi
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              base_keep="refs/remotes/origin/${GITHUB_BASE_REF}"
              case " $keep_list " in *" $base_keep "*) ;; *) keep_list="$keep_list $base_keep" ;; esac
            fi
            kept=0
            dropped=0
            while IFS= read -r ref; do
              [ -n "$ref" ] || continue
              keep=""
              # `set -f`: $keep_list is deliberately unquoted so it splits on whitespace into
              # individual refs, and without noglob a ref/branch name containing a glob character
              # would be expanded against the working directory instead of compared literally.
              set -f
              for k in $keep_list; do
                if [ "$ref" = "$k" ]; then keep=1; break; fi
              done
              set +f
              if [ -n "$keep" ]; then
                kept=$((kept + 1))
                continue
              fi
              git update-ref -d "$ref"
              dropped=$((dropped + 1))
            done < "$RUNNER_TEMP/remote-refs.txt"
            echo "stale remote-tracking refs: $kept kept, $dropped dropped (keep list: $keep_list)."
            # The pull_request arm is LIVE: this template ships the trigger (see TRIGGER STRATEGY at the
            # top). It scans ONLY the proposed range origin/<base>..HEAD, where HEAD is the merge commit
            # GitHub builds for the PR. A secret already on the base is the base's finding - graded by
            # the push to the base and by the weekly sweep - and is never attributed to this PR.
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              # fetch-depth:0 has ALREADY brought refs/remotes/origin/<base> down with the rest of the
              # ref graph, so the range needs no fetch - only proof that the ref is really there. A
              # missing base ref would make gitleaks resolve an empty range and report a triumphant zero.
              if ! git rev-parse --verify --quiet "refs/remotes/origin/${GITHUB_BASE_REF}" >/dev/null; then
                echo "::error::gitleaks COULD NOT RUN: refs/remotes/origin/${GITHUB_BASE_REF} is missing, so the range origin/${GITHUB_BASE_REF}..HEAD cannot be resolved and the secret scan would report a clean zero having read nothing. The checkout step in this job must run with 'fetch-depth: 0' (standard C1) - restore it."
                exit 2
              fi
              scope="origin/${GITHUB_BASE_REF}..HEAD"
            else
              # A push reaches this arm only on the default branch (on.push.branches), and scans that
              # branch's FULL history. NOT --all on a push. The coverage chain as shipped: a commit is
              # scanned by the PR that proposes it (its range), again by the push that lands it on the
              # default branch (full history), and every week by the --all sweep above. A branch pushed
              # WITHOUT a PR is reached only by that weekly sweep (or a manual workflow_dispatch).
              scope="HEAD"
            fi
          fi
          # ONE decision, TWO consumers. $scope is the rev selection this event chose; the gitleaks flag
          # AND the upper bound below are both built from it, so the bound can never describe a scope
          # other than the one gitleaks was given. Every value is a single token (--all, HEAD or
          # origin/<base>..HEAD), so it is quoted everywhere.

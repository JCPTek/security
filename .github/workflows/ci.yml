            if(has(e,"name")){if(typeof e.name!=="string")return fail(`${at}: its name is not a string`);name=e.name}
            if(has(e,"link")&&typeof e.link!=="boolean")return fail(`${at}: link is not true or false`);
            // An installed entry is held to its name and version BEFORE anything else, resolved URL or not: with no resolved
            // URL npm fetches `<name>@<version>` (a name that is a URL fetches that URL, a range fetches what matches it), and a
            // name that is not the folder's puts that package where code require()s the folder's.
            if(folder!==null&&e.link!==true){
              if(!NAME.test(name))return fail(`${at}: its name "${show(name)}" is not a valid npm package name`);
              if(typeof e.version!=="string"||!VERSION.test(e.version))return fail(`${at}: its version (${typeof e.version==="string"?show(e.version):"not a string"}) is not an exact semver version`);
              if(FILEISH.test(e.version))return fail(`${at}: its version (${show(e.version)}) ends like a tarball file name, so npm would install the file of that name from the repository`);
              if(name!==folder&&!aliases.has(`${folder}=${name}`))return fail(`${at}: its name is ${name}, so npm installs ${name} in the ${folder} folder, and NPM_LOCK_ALIASES does not list ${folder}=${name}`)}
            if(!has(e,"resolved")){if(e.link===true)return fail(`${at} is a link with no resolved target`);

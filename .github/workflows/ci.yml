          let checked=0;
          for(const f of files.sort()){const rf=rel(f);let text,d;
            try{text=new TextDecoder("utf-8",{fatal:true,ignoreBOM:true}).decode(fs.readFileSync(f))}
            catch(e){fail(`${rf} could not be read as UTF-8 JSON (${e.message})`);continue}
            if(text.startsWith("\uFEFF")){fail(`${rf} begins with a byte order mark, which npm skips but OSV-Scanner cannot parse, so it would grade nothing in this lockfile; save it as UTF-8 without one`);continue}
            let sc;try{sc=scan(text)}catch(e){fail(`${rf} could not be read as UTF-8 JSON (${e.message})`);continue}
            if(sc.deep){fail(`${rf} nests deeper than 64 levels, far more than any lockfile npm writes`);continue}
            try{d=JSON.parse(text)}catch(e){fail(`${rf} could not be read as UTF-8 JSON (${e.message})`);continue}

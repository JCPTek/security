              // a bundled one, unpacked from its parent's tarball, may have none.
              if(folder!==null){if(e.inBundle===true&&bundled(key,pk)){tally.bundled++;return}
                return fail(`${at} has no resolved URL, so npm would fetch ${name}@${e.version} with nothing here to pin its source (only an inBundle entry inside a package that bundles it may have none); regenerate the lockfile with a current npm`)}
              tally.unresolved++;return}
            const r=e.resolved;
            if(typeof r!=="string")return fail(`${at}: resolved is not a string`);
            if(e.link===true&&workspace(dir,folder,r,pk)){tally.workspace++;return}
            // git, file and link sources: reported, and allowed only when NPM_LOCK_ALLOWED_SOURCES lists them exactly (a git
            // source by its URL without the #commit, which must be a full commit hash).
            if(e.link===true||/^file:/.test(r)){const kind=e.link===true?"link":"file";
              // A link through a "~" part never passes as a workspace, so the error says how a real one passes.
              const tilde=e.link===true&&r.includes("~")?`; a path part holding "~" is never taken as a workspace, because Windows can read it as the 8.3 short name of another folder (NODE_M~1 for node_modules): list a real workspace whose path holds "~" in NPM_LOCK_ALLOWED_SOURCES by its exact resolved value`:"";
              if(!allowed.has(r))return fail(`${at} is a ${kind} source (${show(r)}), which is not listed in NPM_LOCK_ALLOWED_SOURCES${tilde}`);
              console.log(`::notice::${esc(`${at}: ${kind} source ${show(r)}, allowed by NPM_LOCK_ALLOWED_SOURCES.`)}`);tally.listed++;return}
            if(/^git[+:]/.test(r)||/^(?:github|gitlab|bitbucket|gist):/.test(r)){const g=GIT.exec(r);
              if(!g)return fail(`${at} is a git source (${show(r)}) that is not git+ssh:// or git+https:// pinned to a full commit hash (#<40 or 64 hex>)`);
              if(!allowed.has(g[1]))return fail(`${at} is a git source (${show(g[1])}), which is not listed in NPM_LOCK_ALLOWED_SOURCES`);
              console.log(`::notice::${esc(`${at}: git source ${show(g[1])} at ${g[2]}, allowed by NPM_LOCK_ALLOWED_SOURCES.`)}`);tally.listed++;return}
            if(/^http:\/\//.test(r))return fail(`${at}: resolved ${show(r)} is not https`);
            const u=URL_.exec(r);
            if(!u)return fail(`${at}: resolved ${show(r)} is not a plain https URL (user info, a port, a query, a fragment or whitespace are not allowed)`);
            const host=u[1],p=u[2];
            if(name===null)return fail(`${at}: an entry outside node_modules with no name, so this step cannot tell which package ${show(r)} should be`);
            if(!NAME.test(name))return fail(`${at}: its name "${show(name)}" is not a valid npm package name`);
            if(typeof e.version!=="string"||!VERSION.test(e.version))return fail(`${at}: its version (${typeof e.version==="string"?show(e.version):"not a string"}) is not an exact semver version`);
            const scope=name.startsWith("@")?name.slice(0,name.indexOf("/")):null,want=scope!==null&&scopeHost.has(scope)?scopeHost.get(scope):DEFAULT_HOST;
            if(host!==want){
              if(want!==DEFAULT_HOST)return fail(`${at}: ${name} is in ${scope}, which NPM_LOCK_SCOPE_HOSTS maps to ${want}, but it resolves from ${host}`);
              if(hostScopes.has(host))return fail(`${at}: ${name} resolves from ${host}, which NPM_LOCK_SCOPE_HOSTS allows only for ${hostScopes.get(host).join(", ")}`);
              return fail(`${at}: ${name} resolves from ${host}, which is not an allowed host (${DEFAULT_HOST}, or a host NPM_LOCK_SCOPE_HOSTS maps a scope to)`)}
            const base=scope!==null?name.slice(scope.length+1):name;

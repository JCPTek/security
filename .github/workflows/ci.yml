            console.log(`::error::npm lockfile integrity: ${errs.length} problem(s) across ${files.length} lockfile(s) - failing closed (J6).`);process.exit(1)}
          if(!files.length){console.log("npm lockfile integrity: no package-lock.json or npm-shrinkwrap.json in the checkout - nothing to check.");process.exit(0)}
          console.log(`npm lockfile integrity: ${checked} lockfile(s), every resolved URL https, from an allowed host, and the entry's own name and version.`);
          EOF

      # ---------- Licenses: every project and lockfile against the dev-standards policy (I1/C3, Jacob 2026-10-30) ----------
      - name: License allowlist gate (I1, every project and lockfile, fail-closed)
        # One PowerShell script, byte-identical to ci-selfhosted.yml's step (templates/NOTES.md, security/license-gate,
        # has the design): the policy is embedded from dev-standards templates/license-policy.json; DISTRIBUTION is
        # required; every tracked project's packages.lock.json and every npm lockfile is judged; it reads committed
        # files and nuget.org metadata only. templates/tests/Test-LicenseGate.ps1 is its harness.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # ONE script in both templates (PS 5.1 / pwsh); it reads committed files and nuget.org metadata, runs no repository code.
          $ErrorActionPreference = 'Stop'
          $OIC = [StringComparison]::OrdinalIgnoreCase; $ORD = [StringComparison]::Ordinal
          function Esc([string]$s) { return ((($s -replace '%', '%25') -replace "`r", '%0D') -replace "`n", '%0A') }
          $script:errs = 0
          function Add-Err([string]$s) { $script:errs++; Write-Host "::error::$(Esc $s)" }
          function Stop-Gate([string]$s) { Write-Host "::error::$(Esc "$s The license gate could not run (I1, failing closed).")"; exit 1 }
          $repoRoot = $env:GITHUB_WORKSPACE; if (-not $repoRoot) { $repoRoot = (Get-Location).Path }
          # Generated from dev-standards templates/license-policy.json (scripts/license-policy.py): never edit it here.
          $licensePolicyJson = @'
          {
            "policy": "dev-standards license policy (DEV-STANDARDS I1 and C3), embedded in the CI templates' License allowlist gate by scripts/license-policy.py",
            "version": "2026-10-30.1",
            "allow": ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD", "MIT-0", "Unlicense", "Zlib", "BlueOak-1.0.0", "CC0-1.0",
              "CC-BY-3.0", "CC-BY-4.0", "Python-2.0", "PostgreSQL", "WTFPL", "MS-PL", "OFL-1.1"],
            "deny": [
              {"class": "copyleft", "severity": 1, "redistributable": true, "buildOnlyPasses": true,
               "note": "redistribution is permitted, with copyleft obligations: I1 blocks it in shipped code unless a decision-noted exception (C3) accepts it",
               "ids": ["AGPL-*", "GPL-*", "LGPL-*", "MPL-*", "EPL-*", "CDDL-*", "EUPL-*", "OSL-*", "CPAL-*", "CPL-*", "MS-RL", "RPL-*", "RPSL-*", "APSL-*",
                 "SPL-*", "NPL-*", "IPL-*", "QPL-*", "Sleepycat", "CECILL-*", "CC-BY-SA-*", "GFDL-*", "ODbL-*", "LPL-*", "Watcom-*"]},
              {"class": "no-redistribution", "severity": 3, "redistributable": false, "buildOnlyPasses": false,
               "note": "source-available, non-commercial, no-derivatives or use-restricted terms: never redistributable in a commercial closed product",
               "ids": ["SSPL-*", "BUSL-*", "Elastic-*", "PolyForm-*", "CC-BY-NC*", "CC-BY-ND*", "CC-NC*", "JSON", "Hippocratic-*", "Commons-Clause",
                 "LicenseRef-*Commons-Clause*"]}
            ],
            "unknown": {"class": "unknown", "severity": 2, "redistributable": true, "buildOnlyPasses": false,
              "note": "not an SPDX expression of known ids (a URL, a license file, free text or no license at all): fails unless a decision-noted exception accepts it"},
            "restricted": {
              "packages": [
                {"ecosystem": "nuget", "id": "Microsoft.Management.Infrastructure.Runtime.Win",
                 "why": "Microsoft Software License Terms for the MI runtime: use solely with Microsoft PowerShell, and no sharing, publishing or distribution to any third party (JCPTek/endpointforge, 2026-10-30)"}
              ],
              "texts": [
                {"name": "use limited to another product, no distribution",
                 "all": ["\\bsolely for use with\\b", "\\b(will not|may not|must not|shall not|no right to)\\b[\\s\\S]{0,1200}?\\bdistribut"]},
                {"name": "licensed, not sold, and no sharing or distribution",
                 "all": ["\\blicensed, not sold\\b", "\\bshare, publish, distribute[,]? or lend\\b"]}
              ]
            },
            "npmTestPathSegments": ["test", "tests", "__tests__", "fixtures", "__fixtures__", "testdata", "e2e"]
          }
          '@
          $licensePolicyJson = $licensePolicyJson.Replace("`r`n", "`n")
          try { $pol = ConvertFrom-Json -InputObject $licensePolicyJson } catch { Stop-Gate "The embedded license policy is not valid JSON ($($_.Exception.Message))." }
          $polHash = -join @([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($licensePolicyJson)) | ForEach-Object { $_.ToString('x2') })
          $WS = '[\t\n\v\f\r \u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'
          function Get-Trim([string]$s) { return [regex]::Replace($s, ('^' + $WS + '+|' + $WS + '+$'), '') }
          function G($o, [string]$k) { if (($o -is [Collections.IDictionary]) -and $o.ContainsKey($k)) { return $o[$k] }; return $null }
          function Read-Json([string]$Path) {
            $t = [IO.File]::ReadAllText($Path)
            if ($PSVersionTable.PSEdition -eq 'Desktop') {
              Add-Type -AssemblyName System.Web.Extensions
              $j = New-Object System.Web.Script.Serialization.JavaScriptSerializer; $j.MaxJsonLength = [int]::MaxValue; $j.RecursionLimit = 512
              return ,$j.DeserializeObject($t)
            }
            return ,(ConvertFrom-Json -InputObject $t -AsHashtable -Depth 512)
          }

          # ---- DISTRIBUTION: required, no default; unset is an error and judged as shipped ----
          $dist = "$env:DISTRIBUTION"; $shipped = $true
          if ([string]::Equals($dist, 'internal', $ORD)) { $shipped = $false }
          elseif (-not [string]::Equals($dist, 'shipped', $ORD)) { Add-Err "DISTRIBUTION is '$dist'. Set it in the workflow env block to shipped (anything built here reaches a customer or any other third party) or internal (nothing built here ever leaves the org). It has no default; until it is set, everything is judged as shipped (I1)." }

          # ---- license classes: allowlist, deny classes (id globs), unknown ----
          function New-Class($c) { return [pscustomobject]@{ name = [string]$c.class; sev = [int]$c.severity; redist = [bool]$c.redistributable; light = [bool]$c.buildOnlyPasses; note = [string]$c.note } }
          $unknown = New-Class $pol.unknown
          $denyRes = @(foreach ($d in @($pol.deny)) { $cls = New-Class $d; foreach ($i in @($d.ids)) { [pscustomobject]@{ re = ('^' + ([regex]::Escape([string]$i) -replace '\\\*', '.*') + '$'); cls = $cls } } })
          $allowSet = New-Object 'Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
          foreach ($a in @($pol.allow)) { [void]$allowSet.Add([string]$a) }
          function Get-TokenClass([string]$t) {
            if ($allowSet.Contains($t)) { return $null }
            foreach ($d in $denyRes) { if ([regex]::IsMatch($t, $d.re, 'IgnoreCase, CultureInvariant')) { return $d.cls } }
            return $unknown
          }
          # SPDX: WITH and a trailing + dropped; an AND passes only if EVERY id is allowlisted, an OR-only one if ANY is.
          function Get-Verdict([string]$Lic) {
            $e = (Get-Trim ([regex]::Replace($Lic, '(?i)\s+WITH\s+[^\s()]+', '')))
            $toks = @(([regex]::Split(($e -replace '[()]', ' '), '(?i)\s+(?:AND|OR)\s+')) | ForEach-Object { (Get-Trim $_).TrimEnd('+') } | Where-Object { $_ })
            $r = [pscustomobject]@{ ok = $false; cls = $unknown; spdx = $false; toks = $toks; bad = @(); orOnly = $false }
            if (($toks.Count -eq 0) -or @($toks | Where-Object { $_ -notmatch '^[A-Za-z0-9][A-Za-z0-9.+-]*$' }).Count) { return $r }
            $r.spdx = $true; $r.orOnly = ($e -match '(?i)\sOR\s') -and ($e -notmatch '(?i)\sAND\s')
            $bad = New-Object Collections.Generic.List[string]; $cls = New-Object Collections.Generic.List[object]
            foreach ($t in $toks) { $c = Get-TokenClass $t; if ($null -ne $c) { $bad.Add($t); $cls.Add($c) } }
            $r.bad = @($bad)
            if (($r.orOnly -and ($bad.Count -lt $toks.Count)) -or ($bad.Count -eq 0)) { $r.ok = $true; $r.cls = $null; return $r }
            if ($r.orOnly) { $r.cls = @($cls | Sort-Object sev)[0] } else { $r.cls = @($cls | Sort-Object sev -Descending)[0] }
            return $r
          }

          # ---- the TRACKED tree (the secrets job's git environment, constant arguments) ----
          function Get-Tracked {
            $psi = New-Object Diagnostics.ProcessStartInfo
            $psi.FileName = 'git'; $psi.Arguments = '--no-replace-objects -c core.quotePath=false ls-files -z'; $psi.WorkingDirectory = $repoRoot
            $psi.EnvironmentVariables['GIT_NO_REPLACE_OBJECTS'] = '1'; $psi.EnvironmentVariables['GIT_CONFIG_NOSYSTEM'] = '1'
            $psi.EnvironmentVariables['GIT_CONFIG_GLOBAL'] = $(if ($env:OS -eq 'Windows_NT') { 'NUL' } else { '/dev/null' })
            $psi.EnvironmentVariables['GIT_CONFIG_COUNT'] = '1'; $psi.EnvironmentVariables['GIT_CONFIG_KEY_0'] = 'safe.directory'
            $psi.EnvironmentVariables['GIT_CONFIG_VALUE_0'] = [IO.Path]::GetFullPath($repoRoot).Replace('\', '/').TrimEnd('/')
            $psi.UseShellExecute = $false; $psi.RedirectStandardOutput = $true; $psi.RedirectStandardError = $true; $psi.CreateNoWindow = $true
            try {
              $proc = [Diagnostics.Process]::Start($psi); $errTask = $proc.StandardError.ReadToEndAsync()
              $ms = New-Object IO.MemoryStream; $proc.StandardOutput.BaseStream.CopyTo($ms); $proc.WaitForExit()
            } catch { Stop-Gate "git ls-files could not start ($($_.Exception.Message))." }
            if ($proc.ExitCode -ne 0) { Stop-Gate "git ls-files exited $($proc.ExitCode) ($(@((Get-Trim "$($errTask.Result)") -split "`r?`n")[0]))." }
            return ,@((New-Object Text.UTF8Encoding($false)).GetString($ms.ToArray()).Split([char]0) | Where-Object { $_ })
          }
          $tracked = Get-Tracked
          $trackedSet = New-Object 'Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
          foreach ($p in $tracked) { [void]$trackedSet.Add($p) }
          function Get-Disk([string]$Rel) { return [IO.Path]::Combine($repoRoot, $Rel) }

          # ---- ci/license-exceptions.txt ----
          $exc = New-Object Collections.Generic.List[object]
          $exPath = Get-Disk 'ci/license-exceptions.txt'
          if (Test-Path -LiteralPath $exPath -PathType Leaf) {
            $k = 0; $seenTok = New-Object 'Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
            foreach ($raw in [IO.File]::ReadAllText($exPath).Split([char]10)) {
              $k++; $l = Get-Trim $raw; $at = "ci/license-exceptions.txt:$k"
              if (($l.Length -eq 0) -or $l.StartsWith('#', $ORD)) { continue }
              $f = @([regex]::Split($l, ($WS + '+')))
              if ($f.Count -lt 6) { Add-Err "$at has $($f.Count) field(s). An exception is <package[@version]> <license> <scope> <YYYY-MM-DD> <approver> <reason> (dev-standards templates/license-exceptions.txt)."; continue }
              $tok = $f[0]; $d = [datetime]::MinValue
              $why = ''
              if ($tok -notmatch '^[A-Za-z0-9@][A-Za-z0-9@/._~+-]*$') { $why = "its package '$tok' is not a NuGet id or npm name, with an optional @version" }
              elseif ($f[1] -notmatch '^[A-Za-z0-9][A-Za-z0-9.+_:()-]*$') { $why = "its license '$($f[1])' is not one token of letters, digits and . + _ : ( ) -" }
              elseif (@('redistributable', 'build-only', 'internal-only') -cnotcontains $f[2]) { $why = "its scope '$($f[2])' is not redistributable, build-only or internal-only" }
              elseif (-not [datetime]::TryParseExact($f[3], 'yyyy-MM-dd', [Globalization.CultureInfo]::InvariantCulture, 'None', [ref]$d)) { $why = "its date '$($f[3])' is not a YYYY-MM-DD date" }
              elseif ($f[4] -notmatch '^[A-Za-z0-9][A-Za-z0-9._@-]*$') { $why = "its approver '$($f[4])' is not one name" }
              elseif (-not $seenTok.Add($tok)) { $why = "another line already names $tok" }
              elseif ($shipped -and [string]::Equals($f[2], 'internal-only', $ORD)) { $why = 'it is internal-only, and this repository is DISTRIBUTION=shipped (or unset): internal-only never covers code that ships' }
              if ($why) { Add-Err "$at is refused: $why."; continue }
              $s = 0; if ($tok.StartsWith('@', $ORD)) { $s = 1 }
              $v = $tok.IndexOf('@', $s); $id = $tok; $ver = $null
              if ($v -gt 0) { $id = $tok.Substring(0, $v); $ver = $tok.Substring($v + 1) }
              $exc.Add([pscustomobject]@{ line = $k; at = $at; tok = $tok; id = $id; ver = $ver; lic = $f[1]; scope = $f[2]; used = $false })
            }
          }
          function Find-Exception($p) {
            $hit = @($exc | Where-Object { [string]::Equals($_.id, $p.id, $OIC) -and (($null -eq $_.ver) -or [string]::Equals($_.ver, $p.ver, $OIC)) } | Sort-Object { $null -eq $_.ver })
            if ($hit.Count) { return $hit[0] }; return $null
          }

          # ---- nuget.org metadata: the nuspec; the package only for a license file or a build-only claim ----
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Add-Type -AssemblyName System.IO.Compression
          $nugetBase = 'https://api.nuget.org/v3-flatcontainer/'
          function Get-Remote([string]$Uri) {
            $why = ''
            for ($a = 1; $a -le 3; $a++) {
              try { return [pscustomobject]@{ ok = $true; missing = $false; bytes = (New-Object Net.WebClient).DownloadData($Uri) } } catch {
                $e = $_.Exception; $why = $e.Message
                while ($e) {
                  if (($e -is [IO.FileNotFoundException]) -or ($e -is [IO.DirectoryNotFoundException])) { return [pscustomobject]@{ ok = $false; missing = $true } }
                  if (($e -is [Net.WebException]) -and ($e.Response -is [Net.HttpWebResponse]) -and ([int]$e.Response.StatusCode -eq 404)) { return [pscustomobject]@{ ok = $false; missing = $true } }
                  $e = $e.InnerException
                }
              }
              if ($a -lt 3) { Start-Sleep -Seconds 2 }
            }
            return [pscustomobject]@{ ok = $false; missing = $false; why = $why }
          }
          function Read-Xml([byte[]]$b) {
            $set = New-Object Xml.XmlReaderSettings; $set.DtdProcessing = [Xml.DtdProcessing]::Prohibit; $set.XmlResolver = $null
            $doc = New-Object Xml.XmlDocument; $doc.XmlResolver = $null; $doc.Load([Xml.XmlReader]::Create((New-Object IO.MemoryStream(, $b)), $set))
            return $doc.SelectSingleNode("/*[local-name()='package']/*[local-name()='metadata']")
          }
          function Get-Nupkg($p) {
            if ($null -eq $p.zip) {
              $r = Get-Remote "$nugetBase$($p.idl)/$($p.verl)/$($p.idl).$($p.verl).nupkg"
              if (-not $r.ok) { $p.zip = $false; $p.zipWhy = $(if ($r.missing) { 'it is not on nuget.org' } else { "nuget.org did not answer ($($r.why))" }) }
              else { $p.zip = New-Object IO.Compression.ZipArchive((New-Object IO.MemoryStream(, $r.bytes))) }
            }
            return $p.zip
          }
          function Get-NuGetMeta($p) {
            $r = Get-Remote "$nugetBase$($p.idl)/$($p.verl)/$($p.idl).nuspec"
            if (-not $r.ok) {
              if ($r.missing) { $p.kind = 'none'; $p.show = 'no metadata on nuget.org (a private or first-party package?)'; return }
              Add-Err "could not read $($p.id) $($p.ver)'s metadata from nuget.org ($($r.why)), so its license is unknown. A scan that could not run is not a pass (I1, failing closed)."
              $p.kind = 'error'; $p.show = 'unreadable'; return
            }
            try { $md = Read-Xml $r.bytes } catch { $md = $null }
            if ($null -eq $md) { Add-Err "$($p.id) $($p.ver): nuget.org served a nuspec this gate cannot read (I1, failing closed)."; $p.kind = 'error'; $p.show = 'unreadable'; return }
            $dd = $md.SelectSingleNode("*[local-name()='developmentDependency']"); $p.devDep = ($null -ne $dd) -and ((Get-Trim $dd.InnerText) -eq 'true')
            $ln = $md.SelectSingleNode("*[local-name()='license']"); $lu = $md.SelectSingleNode("*[local-name()='licenseUrl']")
            if ($ln -and ((Get-Trim $ln.InnerText).Length -gt 0)) {
              $v = Get-Trim $ln.InnerText
              if ($ln.GetAttribute('type') -eq 'file') {
                $p.kind = 'file'; $p.show = "file $v"; $z = Get-Nupkg $p
                if (-not $z) { Add-Err "$($p.id) $($p.ver): its license is the file $v in the package, which could not be read ($($p.zipWhy)) (I1, failing closed)."; return }
                $en = @($z.Entries | Where-Object { [string]::Equals($_.FullName, $v.Replace('\', '/'), $OIC) })
                if (-not $en.Count) { $p.show += ' (missing from the package)'; return }
                if ($en[0].Length -gt 4194304) { $p.show += ' (over 4 MB, not read)'; return }
                $sr = New-Object IO.StreamReader($en[0].Open(), $true); $p.text = $sr.ReadToEnd(); $sr.Dispose(); return
              }
              $p.kind = 'expression'; $p.lic = $v; $p.show = $v; return
            }
            if ($lu -and ((Get-Trim $lu.InnerText).Length -gt 0)) {
              $u = Get-Trim $lu.InnerText
              $m = [regex]::Match($u, '^https?://licenses\.nuget\.org/([^?#]+)$')
              if ($m.Success) { $p.kind = 'expression'; $p.lic = [Uri]::UnescapeDataString($m.Groups[1].Value); $p.show = $p.lic; return }
              $p.kind = 'url'; $p.show = "url $u"; return
            }
            $p.kind = 'none'; $p.show = 'no license metadata'
          }

          # ---- the packages, each with every place that pulls it in ----
          $pkgs = New-Object 'Collections.Generic.Dictionary[string,object]' ([StringComparer]::Ordinal)
          function Add-Occ([string]$Eco, [string]$Id, [string]$Ver, [string]$Where, [bool]$BuildOnly, $Ctx, [string]$Key) {
            $pk = "$Eco|$($Id.ToLowerInvariant())@$($Ver.ToLowerInvariant())"
            if (-not $pkgs.ContainsKey($pk)) { $pkgs[$pk] = [pscustomobject]@{ eco = $Eco; id = $Id; ver = $Ver; idl = $Id.ToLowerInvariant(); verl = ($Ver.ToLowerInvariant() -replace '\+.*$', ''); kind = $null; lic = ''; show = ''; text = $null; devDep = $false; zip = $null; zipWhy = ''; occ = (New-Object 'Collections.Generic.Dictionary[string,object]' ([StringComparer]::Ordinal)) } }
            $occ = $pkgs[$pk].occ
            if ($occ.ContainsKey($Where)) { if (-not $BuildOnly) { $occ[$Where].buildOnly = $false }; return }
            $occ[$Where] = [pscustomobject]@{ where = $Where; buildOnly = $BuildOnly; ctx = $Ctx; key = $Key }
          }
          function Get-Via($o, [string]$Name) {
            if ($o.ctx.direct.Contains($Name)) { return 'direct' }
            $seen = New-Object 'Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase); $q = New-Object Collections.Generic.Queue[string]
            $q.Enqueue($Name); [void]$seen.Add($Name); $top = New-Object Collections.Generic.List[string]
            while ($q.Count -and ($top.Count -lt 3)) {
              $n = $q.Dequeue()
              if ($o.ctx.parents.ContainsKey($n)) { foreach ($u in $o.ctx.parents[$n]) { if ($seen.Add($u)) { if ($o.ctx.direct.Contains($u)) { $top.Add($u) } else { $q.Enqueue($u) } } } }
            }
            if ($top.Count) { return 'via ' + ($top -join ', ') }; return ''
          }
          function New-Ctx { return [pscustomobject]@{ direct = (New-Object 'Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)); parents = (New-Object 'Collections.Generic.Dictionary[string,object]' ([StringComparer]::OrdinalIgnoreCase)) } }
          function Add-Parent($Ctx, [string]$Child, [string]$Parent) { if (-not $Ctx.parents.ContainsKey($Child)) { $Ctx.parents[$Child] = New-Object Collections.Generic.List[string] }; $Ctx.parents[$Child].Add($Parent) }

          # ---- NuGet: EVERY tracked project (LOCKFILE_GATE_EXCLUDE as the lockfile gate reads it) ----
          $excl = @("$env:LOCKFILE_GATE_EXCLUDE" -split '\s+' | Where-Object { $_ })
          $projects = New-Object Collections.Generic.List[string]
          foreach ($p in $tracked) {
            if (($p -notmatch '(?i)\.(cs|vb|fs)proj$') -or ($p -match '(?i)(^|/)node_modules/')) { continue }
            if (@($excl | Where-Object { $p -like $_ }).Count) { Write-Host "::notice::$(Esc "license gate: $p is not scanned: LOCKFILE_GATE_EXCLUDE names it (a fixture that is never restored, built or shipped).")"; continue }
            $projects.Add($p)
          }
          if ($env:LICENSE_TARGET) {
            foreach ($t0 in @($env:LICENSE_TARGET -split '\|')) {
              $t = (Get-Trim $t0).Replace('\', '/'); if ($t.StartsWith('./', $ORD)) { $t = $t.Substring(2) }
              if (-not $t) { Add-Err "LICENSE_TARGET='$env:LICENSE_TARGET' has an empty entry. Separate projects with a single '|'."; continue }
              if (-not $trackedSet.Contains($t)) { Add-Err "LICENSE_TARGET entry '$t' is not a tracked file. LICENSE_TARGET only adds back a project LOCKFILE_GATE_EXCLUDE leaves out."; continue }
              if ($t -match '(?i)\.slnx?$') { Write-Host "::notice::$(Esc "license gate: LICENSE_TARGET entry $t adds nothing: every tracked project is scanned, in a solution or not.")"; continue }
              if ($t -notmatch '(?i)\.(cs|vb|fs)proj$') { Add-Err "LICENSE_TARGET entry '$t' is not a project file."; continue }
              if (-not @($projects | Where-Object { [string]::Equals($_, $t, $OIC) }).Count) { $projects.Add($t) }
            }
          }
          $nTest = 0
          foreach ($proj in $projects) {
            $dir = ''; $s = $proj.LastIndexOf('/'); if ($s -ge 0) { $dir = $proj.Substring(0, $s + 1) }
            $base = [IO.Path]::GetFileNameWithoutExtension($proj)
            $lock = @(@("${dir}packages.$base.lock.json", "${dir}packages.lock.json") | Where-Object { $trackedSet.Contains($_) })
            if (-not $lock.Count) { Add-Err "COVERAGE: $proj has no committed packages.lock.json, so no license check sees its packages. Commit one (RestorePackagesWithLockFile, J6), or list a never-built fixture in LOCKFILE_GATE_EXCLUDE."; continue }
            try { $j = Read-Json (Get-Disk $lock[0]); $deps = G $j 'dependencies' } catch { $deps = $null }
            if (-not ($deps -is [Collections.IDictionary])) { Add-Err "COVERAGE: $($lock[0]) is not a NuGet lockfile this gate can read, so $proj is not license-checked."; continue }
            $ctx = New-Ctx; $isTest = $false; $entries = New-Object Collections.Generic.List[object]
            foreach ($tfm in @($deps.Keys)) {
              $g = $deps[$tfm]; if (-not ($g -is [Collections.IDictionary])) { continue }
              foreach ($name in @($g.Keys)) {
                $e = $g[$name]; $type = [string](G $e 'type')
                if ($type -eq 'Direct') { [void]$ctx.direct.Add($name); if ([string]::Equals($name, 'Microsoft.NET.Test.Sdk', $OIC)) { $isTest = $true } }
                $sub = G $e 'dependencies'; if ($sub -is [Collections.IDictionary]) { foreach ($c in @($sub.Keys)) { Add-Parent $ctx $c $name } }
                if ($type -ne 'Project') { $entries.Add(@($name, [string](G $e 'resolved'))) }
              }
            }
            $pf = Get-Disk $proj
            if ((-not $isTest) -and (Test-Path -LiteralPath $pf -PathType Leaf) -and ([IO.File]::ReadAllText($pf) -match '(?i)<IsTestProject>\s*true\s*</IsTestProject>')) { $isTest = $true }
            if ($isTest) { $nTest++ }
            foreach ($x in $entries) { if ($x[1]) { Add-Occ 'nuget' $x[0] $x[1] $proj $isTest $ctx $x[0] } else { Add-Err "$($lock[0]): $($x[0]) has no resolved version (I1, failing closed)." } }
            Write-Host (Esc "license gate: $proj ($(if ($isTest) { 'test project, build-only' } else { 'ships' })): $($entries.Count) package entries in $($lock[0]).")   # a path may hold CR or LF
          }

          # ---- npm: EVERY committed lockfile, by the license npm recorded per entry ----
          $testSeg = @($pol.npmTestPathSegments | ForEach-Object { [string]$_ })
          $npmLocks = 0
          foreach ($lf in $tracked) {
            if ($lf -match '(?i)(^|/)node_modules/') { continue }
            $b = $lf.Substring($lf.LastIndexOf('/') + 1)
            if (@('pnpm-lock.yaml', 'yarn.lock', 'bun.lock', 'bun.lockb') -contains $b.ToLowerInvariant()) { Add-Err "COVERAGE: $lf is a $b lockfile, which records no licenses, so its packages are not license-checked. Use npm, or extend the dev-standards gate first."; continue }
            if (@('package-lock.json', 'npm-shrinkwrap.json') -notcontains $b.ToLowerInvariant()) { continue }
            $npmLocks++
            try { $j = Read-Json (Get-Disk $lf); $pk = G $j 'packages' } catch { $pk = $null }
            if (-not ($pk -is [Collections.IDictionary])) { Add-Err "COVERAGE: $lf has no packages map (lockfileVersion $(G $j 'lockfileVersion')), so this gate cannot read its licenses. Regenerate it with npm 7 or later."; continue }
            $dirSegs = $lf.Split('/'); $testOnly = $false
            for ($q = 0; $q -lt $dirSegs.Count - 1; $q++) { if ($testSeg -contains $dirSegs[$q].ToLowerInvariant()) { $testOnly = $true } }
            $ctx = New-Ctx; $n = 0
            foreach ($k in @($pk.Keys)) {
              $e = $pk[$k]; $at = $k.LastIndexOf('node_modules/'); $name = [string](G $e 'name'); if ((-not $name) -and ($at -ge 0)) { $name = $k.Substring($at + 13) }
              foreach ($dk in @('dependencies', 'optionalDependencies', 'peerDependencies', 'devDependencies')) {
                $sub = G $e $dk
                if ($sub -is [Collections.IDictionary]) { foreach ($c in @($sub.Keys)) { if ($k -eq '') { [void]$ctx.direct.Add($c) } elseif ($name) { Add-Parent $ctx $c $name } } }
              }
            }
            foreach ($k in @($pk.Keys)) {
              $e = $pk[$k]; $at = $k.LastIndexOf('node_modules/')
              if (($at -lt 0) -or ((G $e 'link') -eq $true)) { continue }   # the root, a workspace member, a link: first-party
              $name = [string](G $e 'name'); if (-not $name) { $name = $k.Substring($at + 13) }
              $ver = [string](G $e 'version'); if (-not $ver) { $ver = '0.0.0-unversioned' }
              Add-Occ 'npm' $name $ver $lf ($testOnly -or ((G $e 'dev') -eq $true)) $ctx $name
              $p = $pkgs["npm|$($name.ToLowerInvariant())@$($ver.ToLowerInvariant())"]
              if ($null -eq $p.kind) {
                $l = G $e 'license'
                if ($l -is [Collections.IDictionary]) { $l = G $l 'type' } elseif (($l -is [Array]) -or ($l -is [Collections.IList])) { $l = (@($l | ForEach-Object { if ($_ -is [Collections.IDictionary]) { G $_ 'type' } else { $_ } }) -join ' AND ') }
                if ($l) { $p.kind = 'expression'; $p.lic = [string]$l; $p.show = [string]$l } else { $p.kind = 'none'; $p.show = 'no license in the lockfile' }
              }
              $n++
            }
            Write-Host (Esc "license gate: $lf$(if ($testOnly) { ' (test-only path, build-only)' }): $n package entries.")
          }

          # ---- the verdict, package by package ----
          $restrictedIds = @{}
          foreach ($r in @($pol.restricted.packages)) { $restrictedIds["$($r.ecosystem)|$(([string]$r.id).ToLowerInvariant())"] = [string]$r.why }
          $rows = New-Object Collections.Generic.List[string]; $nOk = 0; $nLight = 0; $nEx = 0
          function Format-Occ($p) {
            $all = @($p.occ.Values | Sort-Object { $_.buildOnly }, where)
            $s = @($all | Select-Object -First 5 | ForEach-Object { $v = Get-Via $_ $_.key; $t = $_.where; if ($_.buildOnly) { $t += $(if ($p.eco -eq 'npm') { ' (dev)' } else { ' (test)' }) }; if ($v) { $t += " ($v)" }; $t }) -join '; '
            if ($all.Count -gt 5) { $s += "; and $($all.Count - 5) more" }
            return $s
          }
          function Add-Fail($p, [string]$Why) {
            $w = Format-Occ $p
            Add-Err "LICENSE $($p.eco) $($p.id) $($p.ver) [$($p.show)] pulled in by $($w): $Why"
            $rows.Add("| $($p.eco) | $($p.id) | $($p.ver) | $($p.show) | $w | $Why |".Replace("`r", ' ').Replace("`n", ' '))
          }
          function Test-DevOnly($p) {
            if (-not $p.devDep) { return $false }
            $z = Get-Nupkg $p; if (-not $z) { return $false }
            return (@($z.Entries | Where-Object { $_.FullName -match '(?i)^(lib|ref|runtimes|native|content|contentFiles|build|buildTransitive|buildMultiTargeting)/' }).Count -eq 0)
          }
          foreach ($p in @($pkgs.Values | Sort-Object eco, idl, verl)) {
            if ($p.eco -eq 'nuget') { Get-NuGetMeta $p; if ($p.kind -eq 'error') { continue } }
            $ship = @($p.occ.Values | Where-Object { -not $_.buildOnly }).Count -gt 0
            $rWhy = $restrictedIds["$($p.eco)|$($p.idl)"]
            if ((-not $rWhy) -and $p.text) {
              $norm = [regex]::Replace((($p.text -replace '[\u2018\u2019]', "'") -replace '[\u201C\u201D]', '"'), '\s+', ' ')
              foreach ($fp in @($pol.restricted.texts)) { if (@($fp.all | Where-Object { -not [regex]::IsMatch($norm, [string]$_, 'IgnoreCase, CultureInvariant') }).Count -eq 0) { $rWhy = "its license text matches the restricted fingerprint '$($fp.name)'"; break } }
            }
            $x = Find-Exception $p; if ($x) { $x.used = $true }
            if ($rWhy) {
              if ($shipped) { Add-Fail $p "RESTRICTED: $rWhy. It may not be redistributed: in a DISTRIBUTION=shipped repository it fails whatever ci/license-exceptions.txt says$(if ($x) { " ($($x.at) does not apply)" }). Remove the dependency, or move the code that needs it into an internal repository." }
              elseif (-not $x) { Add-Fail $p "RESTRICTED: $rWhy. In this DISTRIBUTION=internal repository only an internal-only exception (reason, approver, date) can accept it." }
              elseif ($x.scope -cne 'internal-only') { Add-Fail $p "RESTRICTED: $rWhy. $($x.at) is scoped $($x.scope); only an internal-only exception can accept a restricted package." }
              else { $nEx++ }
              continue
            }
            if ($p.kind -eq 'expression') { $vd = Get-Verdict $p.lic } else { $vd = [pscustomobject]@{ ok = $false; cls = $unknown; spdx = $false; toks = @(); bad = @() } }
            if ($vd.ok) { $nOk++; continue }
            if ((-not $ship) -and $vd.cls.light) { $nLight++; continue }   # build-only, and the class binds only distribution
            if (-not $x) { Add-Fail $p "NOT ALLOWLISTED ($($vd.cls.name): $($vd.cls.note)). Replace the package, or add a decision-noted exception to ci/license-exceptions.txt (I1/C3)."; continue }
            if ($vd.spdx) {
              $col = $x.lic; $okCol = $false
              if ($vd.orOnly) { $okCol = @($vd.toks | Where-Object { [string]::Equals($_, $col, $OIC) }).Count -gt 0 }
              else { $okCol = @($vd.bad | Where-Object { -not [string]::Equals($_, $col, $OIC) }).Count -eq 0 }
              if (-not $okCol) { Add-Fail $p "$($x.at) accepts $col, but this version is licensed $($p.lic). Review the new license and write a new line."; continue }
            }
            if ($x.scope -ceq 'redistributable' -and -not $vd.cls.redist) { Add-Fail $p "$($x.at) claims redistributable, but a $($vd.cls.name) license does not permit redistribution. A build tool that never ships takes build-only$(if (-not $shipped) { '; internal code takes internal-only' })."; continue }
            if ($x.scope -ceq 'build-only' -and $ship -and -not (($p.eco -eq 'nuget') -and (Test-DevOnly $p))) { Add-Fail $p "$($x.at) is build-only, but the package reaches code that ships (not only test projects or devDependencies$(if ($p.eco -eq 'nuget') { ', and not a development dependency that puts nothing in a build output' }))."; continue }
            $nEx++
          }
          foreach ($x in $exc) { if (-not $x.used) { Write-Host "::warning::$(Esc "$($x.at) ($($x.tok)) matches no scanned package; remove it once stale.")" } }
          if (Test-Path -LiteralPath (Get-Disk 'ci/no-license-scan.txt')) { Write-Host '::warning::ci/no-license-scan.txt is no longer read: every tracked project and npm lockfile is scanned. Delete it.' }
          $sum = "DISTRIBUTION=$(if ($dist) { $dist } else { '(unset)' }); policy $($pol.version) (sha256 $($polHash.Substring(0, 12))); $($projects.Count) project(s) ($nTest test), $npmLocks npm lockfile(s), $($pkgs.Count) package(s): $nOk allowlisted, $nLight build-only copyleft, $nEx excepted, $($rows.Count) failing"
          if ($env:GITHUB_STEP_SUMMARY) {
            $md = @('### License allowlist gate (I1)', '', $sum, '')
            if ($rows.Count) { $md += @('| ecosystem | package | version | license | pulled in by | reason |', '|---|---|---|---|---|---|') + @($rows | Select-Object -First 200) }
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, (($md -join "`n") + "`n"), (New-Object Text.UTF8Encoding($false)))
          }
          if ($script:errs) { Write-Host "::error::$(Esc "License gate: $sum; $($script:errs) problem(s) above (I1, fail-closed).")"; exit 1 }
          Write-Host (Esc "License gate: $sum.")
          exit 0

      # ---------- SCA: OSV-Scanner (google/osv-scanner; osv.dev = GHSA + NVD) ----------
      - name: Install OSV-Scanner (version is config-driven — H1; verified current 2026-08-07)
        # Binary download (mirrors the gitleaks step) rather than google/osv-scanner-action: the reusable
        # workflow is job-level so its output cannot feed the enrichment step below, and its SARIF upload
        # defaults to GitHub code-scanning, which needs paid GHAS on a PRIVATE repo. The CLI gives a
        # trustworthy exit code, a JSON artifact, and full config control. SHA-pinned action alternative:
        # google/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 (= v2.5.0).
        # `!cancelled()`, like every later gate in this job and the self-hosted OSV step: a red Baseline file
        # check (above) must never hide OSV-Scanner's own result. If THIS step fails, the gate below still runs
        # and fails closed as "could not run": the binary is absent (exit 127), or present but never made
        # executable because its checksum did not match (exit 126). An unverified download is never executed.
        if: ${{ !cancelled() }}
        run: |
          ver="${OSV_SCANNER_VERSION:-2.5.0}"
          # Release asset AND pin by RUNNER_ARCH (see the env block); any other architecture fails closed
          # BEFORE downloading.
          case "${RUNNER_ARCH:-}" in
            X64)   asset="osv-scanner_linux_amd64"; want="$OSV_SCANNER_SHA256" ;;
            ARM64) asset="osv-scanner_linux_arm64"; want="$OSV_SCANNER_SHA256_ARM64" ;;
            *)
              echo "::error::OSV-Scanner could not be installed: RUNNER_ARCH='${RUNNER_ARCH:-}' is neither X64 nor ARM64, so this template has no pinned OSV-Scanner asset or SHA-256 for this runner. FAILING CLOSED (C5) - a scan that cannot run is not a clean scan."
              exit 1 ;;
          esac
          # Defence in depth: never compare against an empty or malformed pin (an empty want would match an empty hash).
          if ! printf '%s' "$want" | grep -Eq '^[0-9a-f]{64}$'; then echo "::error::OSV-Scanner: the pinned SHA-256 for $asset is missing or malformed in the env block - refusing to download an unverifiable binary. FAILING CLOSED (C4/C5)."; exit 1; fi
          curl -sSfL --connect-timeout 10 --speed-limit 1024 --speed-time 30 --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 "https://github.com/google/osv-scanner/releases/download/v${ver}/${asset}" -o "$RUNNER_TEMP/osv-scanner"
          # CI-audit HIGH#1: verify the pinned SHA-256 BEFORE chmod/execute. A hosted runner is ephemeral, but a
          # poisoned mirror or a MITM'd download is still caught here; bump OSV_SCANNER_SHA256 with the version.
          actual=$(sha256sum "$RUNNER_TEMP/osv-scanner" | cut -d' ' -f1)
          if [ "$actual" != "$want" ]; then
            echo "::error::OSV-Scanner download checksum mismatch for $asset: expected $want got $actual. Refusing to execute an unverified binary (CI-audit HIGH#1). If OSV_SCANNER_VERSION was bumped, update OSV_SCANNER_SHA256 (X64) and OSV_SCANNER_SHA256_ARM64 (ARM64)."
            exit 1
          fi
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" --version
      - name: OSV-Scanner SCA gate (C5 — three states, fail-closed)
        # `!cancelled()`: see the install step. With no verified, executable binary this exits "could not run".
        if: ${{ !cancelled() }}
        run: |
          set +e
          # The report goes to RUNNER_TEMP, OUTSIDE the checkout: written into the scanned tree, it was itself
          # scanned by the Semgrep step below (detect-insecure-websocket false positives inside osv-results.json
          # in three repos). Every reader of it (this step, the artifact, the enrichment) takes the same path.
          osv_out="$RUNNER_TEMP/osv-results.json"
          "$RUNNER_TEMP/osv-scanner" scan source -r . --allow-no-lockfiles --format json --output-file "$osv_out"
          rc=$?
          # Exit codes verified with v2.5.0: 0 = no known vulns; 1 = vulnerabilities found; anything
          # else (127/128 ...) = the scan could not run. --allow-no-lockfiles keeps a repo with no
          # manifests (a PowerShell-only repo) at exit 0 rather than erroring. Three outcomes kept
          # permanently distinct, never collapsed (C3/C5): clean -> pass, findings -> evaluate vs the
          # threshold, could-not-run -> FAIL LOUDLY. A broken scanner is never read as a clean repo.
          if [ "$rc" = "0" ]; then
            echo "OSV-Scanner: no known vulnerabilities in any committed manifest."
            exit 0
          fi
          if [ "$rc" != "1" ]; then
            echo "--- osv-results.json (head) ---"; head -c 2000 "$osv_out" 2>/dev/null || true
            echo "::error::OSV-Scanner could not run (exit $rc). A scan that did not run is NOT a clean scan (C3/C5) - failing closed. Check the runner can reach the release download and osv.dev."
            exit 1
          fi
          # rc == 1: OSV found vulnerabilities. Decide pass/fail on machine-readable JSON (never prose),
          # at the config-driven OSV_SEVERITY_THRESHOLD; a group with no CVSS score stays a finding.
          OSV_REPORT="$osv_out" node - <<'EOF'
          const fs=require("fs");
          // CVSS base-score floor per band; 'any' fails on every finding (the default C3 posture).
          const BAND={any:0.0,low:0.1,medium:4.0,high:7.0,critical:9.0};
          const thrName=(process.env.OSV_SEVERITY_THRESHOLD||"any").trim().toLowerCase();
          const thr=BAND[thrName];
          if(thr===undefined){console.log(`::error::OSV_SEVERITY_THRESHOLD='${thrName}' is not one of any, low, medium, high, critical. Refusing to guess a threshold for a security gate.`);process.exit(1)}
          let doc;try{doc=JSON.parse(fs.readFileSync(process.env.OSV_REPORT,"utf8"))}catch(e){console.log(`::error::OSV output was not valid JSON (${e.message}). A scan whose result cannot be read is NOT clean - failing closed (C5).`);process.exit(1)}
          const sum=process.env.GITHUB_STEP_SUMMARY,w=s=>{if(sum){try{fs.appendFileSync(sum,s+"\n")}catch{}}};
          const findings=[],below=[];
          for(const r of (doc.results||[]))for(const p of (r.packages||[])){
            const pk=`${p.package&&p.package.name}@${p.package&&p.package.version}`;
            const vulns=p.vulnerabilities||[],groups=p.groups||[];
            // Vulnerabilities with no severity grouping cannot be ranked -> fail-closed as UNKNOWN.
            if(vulns.length&&!groups.length){findings.push({pk,ids:vulns.map(v=>v.id).join(","),sev:"UNKNOWN"});continue}
            for(const g of groups){
              const ms=g.max_severity;
              const score=(ms===undefined||ms===null||ms==="")?NaN:parseFloat(ms);
              const rec={pk,ids:(g.ids||[]).join(","),sev:isNaN(score)?"UNKNOWN":String(ms)};
              // Unknown/unparseable CVSS counts as a finding: no score is not permission to ignore it.
              if(isNaN(score)||score>=thr)findings.push(rec);else below.push(rec);
            }
          }
          if(findings.length){
            findings.forEach(r=>console.log(`${r.sev.padEnd(8)} ${r.pk} ${r.ids}`));
            w("### :x: OSV-Scanner: vulnerable dependencies");w("");w(`Threshold \`${thrName}\`.`);w("");
            findings.forEach(r=>w(`- \`${r.pk}\` — **${r.sev}** (${r.ids})`));
            console.log(`::error::${findings.length} vulnerable dependency group(s) at or above severity ${thrName} (C5). Upgrade or replace them, or record a decision note.`);
            process.exit(1);
          }
          if(below.length){
            below.forEach(r=>console.log(`below threshold: ${r.sev.padEnd(8)} ${r.pk} ${r.ids}`));
            console.log(`::warning::${below.length} vulnerable dependency group(s) BELOW the ${thrName} threshold. Not failing the build, but these are real findings - raise the threshold or fix them.`);
          }
          console.log(`OSV-Scanner: vulnerabilities present but all below threshold ${thrName}.`);
          EOF
      - name: OSV results (artifact — enrichment input / manual triage)
        if: ${{ !cancelled() }}
        # SHA-pinned (C4).
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: osv-results
          path: ${{ runner.temp }}/osv-results.json   # written under RUNNER_TEMP by the gate step, never in the checkout
          if-no-files-found: ignore

      # ---------- SAST: Semgrep OSS (free, unlimited; NOT CodeQL — code-scanning needs paid GHAS on private repos) ----------
      - name: Semgrep OSS SAST gate (C5 - ONE scan, ERROR blocks, WARNING reports)
        if: ${{ !cancelled() }}   # evaluate independently of the SCA gate above
        run: |
          set +e
          # SENTINEL: the step must reach its last line. A heredoc whose terminator line is damaged (a trailing
          # blank, an indent) swallows the rest of the step, so nothing below it runs and the step would end on
          # cat's exit 0, having installed and scanned nothing. Any exit 0 before sg_done=1 is turned into exit 1.
          sg_done=0
          trap 'sg_rc=$?; if [ "$sg_done" != 1 ] && [ "$sg_rc" = 0 ]; then echo "::error::the Semgrep gate step ended before its last line (an unterminated heredoc swallows the rest of the step): nothing was installed or scanned - failing closed (C5)."; exit 1; fi' EXIT
          # HASH-PINNED INSTALL (C4/C5). Semgrep and EVERY transitive dependency come from the list EMBEDDED below,
          # written to RUNNER_TEMP (outside the checkout) at job time, so the repository commits no requirements
          # file. The block is generated: dev-standards' scripts/semgrep-requirements.py writes
          # templates/semgrep-requirements.txt and rewrites this block from it (--rewrite-blocks), dev-standards' CI
          # fails when the two differ by one byte, and OSV-Scanner reads that file there, with its baseline beside
          # it. NEVER EDIT THE BLOCK BY HAND. Each pin is a release at least 14 days old (or 72 hours old for an
          # advisory fix under C3's security-fix exception, which the list's header names), pinned by the SHA-256 of
          # its wheels. pip runs with --require-hashes, so a file whose hash is not listed, a changed version, or a
          # requirement with no hash is REFUSED, and with --only-binary :all:, so no sdist build runs code at install
          # time. It installs into a FRESH job-private virtual environment under RUNNER_TEMP and the scan runs that
          # environment's semgrep by its full path: a runner image that preinstalls semgrep (a CI_RUNS_ON pool image
          # may), a shared pipx or user site, or anything else on PATH can neither answer for the install nor be the
          # semgrep that runs, and pip never treats an already-installed package as verified. A list that does not
          # pin semgrep==SEMGREP_VERSION, a missing python3-venv, or a refused install fails the gate CLOSED - a SAST
          # gate that could not run is not a pass.
          # ISOLATED from the checkout and the environment (review of #97): the two python commands this step starts
          # itself (venv creation and pip) run with -I, so neither the working directory (the checkout, which `-m`
          # would put first on sys.path, where a committed pip/ or venv/ package or a stdlib-named .py would replace
